name: Workspace workload offline
on:
  pull_request:
    paths:
      - 'src/lib/workspaceTeam*.mjs'
      - 'src/components/workspace/WorkspaceTeamsPanel.tsx'
      - 'src/components/workspace/WorkspaceTeamTaskDiscussion.tsx'
      - 'src/components/workspace/WorkspaceTeamLiveFeed.tsx'
      - 'tests/workspace-team-live.test.mjs'
      - 'tests/workspace-team-utils.test.mjs'
      - 'tests/workspace-team-access.test.mjs'
      - 'tests/workspace-team-activity-history.test.mjs'
      - 'tests/workspace-team-discussion.test.mjs'
      - 'tests/workspace-team-task-operations.test.mjs'
      - 'tests/workspace-team-quick-triage.test.mjs'
      - 'tests/workspace-team-task-board.test.mjs'
      - 'tests/workspace-team-schedule.test.mjs'
      - '.github/workflows/workspace-workload-offline.yml'
permissions:
  contents: read
jobs:
  workload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/workspace-team-task-operations.test.mjs tests/workspace-team-schedule.test.mjs tests/workspace-team-task-board.test.mjs tests/workspace-team-quick-triage.test.mjs tests/workspace-team-discussion.test.mjs tests/workspace-team-live.test.mjs tests/workspace-team-activity-history.test.mjs tests/workspace-team-utils.test.mjs tests/workspace-team-access.test.mjs
