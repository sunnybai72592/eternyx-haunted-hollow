name: CPU neural prefix-only schedule selection

on:
  pull_request:
    paths:
      - "gpu-worker/select_neural_schedule.py"
      - "gpu-worker/tests/test_select_neural_schedule.py"
      - "gpu-worker/adapt_neural_rollout.py"
      - "gpu-worker/train_spatiotemporal_neural_video.py"
      - ".github/workflows/cpu-neural-prefix-schedule.yml"
  push:
    branches: [main]
    paths:
      - "gpu-worker/select_neural_schedule.py"
      - "gpu-worker/tests/test_select_neural_schedule.py"
      - "gpu-worker/adapt_neural_rollout.py"
      - "gpu-worker/train_spatiotemporal_neural_video.py"
      - ".github/workflows/cpu-neural-prefix-schedule.yml"

permissions:
  contents: read

jobs:
  prefix-selection:
    name: Validate leakage-free neural schedule selection and H264 on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require CPU FFmpeg and H264 encoding
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep -q libx264
      - name: Run real source-controlled inner-validation, outer-holdout independence and MP4 tests
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
          OMP_NUM_THREADS: "1"
        run: python -m unittest discover -s gpu-worker/tests -p 'test_select_neural_schedule.py' -v
