name: Cyber Range Local Docker Smoke

on:
  pull_request:
    paths:
      - 'infrastructure/cyber-range/**'
      - 'scripts/cyber-range.mjs'
      - '.github/workflows/cyber-range-local-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-isolated-range:
    name: Build and verify disposable local target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Docker Compose local-only binding and isolation
        run: |
          docker compose version
          docker compose -p eternyx-ci-range -f infrastructure/cyber-range/compose.yaml config --quiet
      - name: Build and launch isolated target
        run: |
          docker compose -p eternyx-ci-range -f infrastructure/cyber-range/compose.yaml up --build -d
          docker compose -p eternyx-ci-range -f infrastructure/cyber-range/compose.yaml ps
          docker compose -p eternyx-ci-range -f infrastructure/cyber-range/compose.yaml logs --tail 50
          if ! curl --fail --silent --show-error --retry 8 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/healthz; then
            docker compose -p eternyx-ci-range -f infrastructure/cyber-range/compose.yaml ps
            docker compose -p eternyx-ci-range -f infrastructure/cyber-range/compose.yaml logs --tail 100
            exit 1
          fi
          docker compose -p eternyx-ci-range -f infrastructure/cyber-range/compose.yaml port gateway 8081 | grep -q '^127\.0\.0\.1:8765
      - name: Verify live HTTP vulnerabilities and network limits
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root = 'http://127.0.0.1:8765';
          const read = async (path, options) => {
            const response = await fetch(root + path, options);
            return { status: response.status, body: await response.json() };
          };
          const own = await read('/api/tickets?ticket=101');
          const other = await read('/api/tickets?ticket=102');
          assert.equal(own.body.owner_id, 7);
          assert.equal(other.body.owner_id, 8);
          const flag = other.body.content.match(/ETERNYX\{[a-z0-9_]+\}/)?.[0];
          assert.ok(flag);
          const verify = await read('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({roomId: 'ticket-idor', flag}),
          });
          assert.equal(verify.body.accepted, true);
          assert.equal(verify.body.accountVerified, false);
          const privateFile = await read('/api/files?name=..%2Fprivate%2Fbrief.txt');
          assert.match(privateFile.body.content, /ETERNYX\{file_traversal_/);
          const denied = await read('/api/files?name=..%2F..%2Fetc%2Fpasswd');
          assert.equal(denied.status, 403);
          assert.equal((await read('/api/ops/report')).status, 403);
          const elevated = await read('/api/ops/report', {headers: {'X-Lab-Role': 'admin'}});
          assert.match(elevated.body.evidence, /ETERNYX\{role_header_/);
          NODE
      - name: Check target cannot initiate external requests
        run: |
          docker compose -p eternyx-ci-range -f infrastructure/cyber-range/compose.yaml exec -T http-range node -e "fetch('https://example.com', {signal: AbortSignal.timeout(1500)}).then(() => process.exit(1), () => process.exit(0))"
      - name: Tear down deliberately vulnerable container
        if: always()
        run: docker compose -p eternyx-ci-range -f infrastructure/cyber-range/compose.yaml down --volumes --remove-orphans

      - name: Verify live HTTP vulnerabilities and network limits
        run: |
          node --input-type=module <<'NODE'
