name: LABS real offline guest image build contract
on:
  pull_request:
    paths:
      - '.github/workflows/labs-fixed-guest-image.yml'
      - 'infrastructure/cyber-range/guest/eternyx_fixed_probe_init.c'
      - 'scripts/labs-build-fixed-guest.py'
      - 'tests/labs-fixed-guest-image-test.py'
permissions:
  contents: read
jobs:
  build-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          submodules: false
      - name: Remove checkout authorization
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || test "$?" -eq 5
          rc=0
          git config --local --get-all http.https://github.com/.extraheader > /dev/null || rc=$?
          test "$rc" -eq 1
      - name: Compile static guest and inspect real ext4 image without KVM
        run: python3 -B tests/labs-fixed-guest-image-test.py
