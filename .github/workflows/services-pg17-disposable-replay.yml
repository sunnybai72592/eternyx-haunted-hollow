name: Services isolated PostgreSQL 17 migration replay

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*service*.sql"
      - "scripts/services-pg17-replay-plan.mjs"
      - "scripts/services-migration-source-guard.mjs"
      - "scripts/automation-migration-collision-forensics.mjs"
      - "scripts/automation-migration-collision-baseline.json"
      - "docs/sql/eternyx/services-phase29-disposable-*.sql"
      - "tests/services-pg17-replay-plan.test.mjs"
      - "tests/services-pg17-role-isolation-phase30.test.mjs"
      - "docs/sql/eternyx/services-phase30-disposable-rls-acceptance.sql"
      - "docs/sql/eternyx/services-phase27-readonly-catalog-verdict.sql"
      - "scripts/services-pg17-catalog-verdict-regressions.mjs"
      - "scripts/services-staging-release-evidence.mjs"
      - "tests/services-pg17-catalog-verdict-phase32.test.mjs"
      - "docs/sql/eternyx/services-phase33-disposable-write-abuse.sql"
      - "tests/services-pg17-write-abuse-phase33.test.mjs"
      - "scripts/services-pg17-concurrency-sql.mjs"
      - "scripts/services-pg17-concurrency-ci.sh"
      - "tests/services-pg17-concurrency-phase34.test.mjs"
      - "scripts/services-phase35-managed-history-reconciler.mjs"
      - "docs/sql/eternyx/services-phase35-readonly-schema-markers.sql"
      - "tests/services-phase35-managed-history-reconciler.test.mjs"
      - "scripts/services-phase36-staging-live-db-proof.mjs"
      - "tests/services-phase36-staging-live-db-proof.test.mjs"
      - "scripts/services-phase37-auditor-privileges.mjs"
      - "scripts/services-phase37-auditor-privilege-replay.mjs"
      - "tests/services-phase37-auditor-privileges.test.mjs"
      - "scripts/services-phase38-executable-definer-guard.mjs"
      - "scripts/services-phase38-definer-mutation-replay.mjs"
      - "tests/services-phase38-definer-surface.test.mjs"
      - "scripts/services-phase39-definer-safety.mjs"
      - "scripts/services-phase39-definer-mutation-replay.mjs"
      - "tests/services-phase39-definer-safety.test.mjs"
      - "scripts/services-phase40-consistent-staging-evidence.mjs"
      - "tests/services-phase40-consistent-evidence.test.mjs"
      - "scripts/services-phase41-registered-staging-project.mjs"
      - "tests/services-phase41-registered-project.test.mjs"
      - "scripts/services-phase42-staging-inventory.mjs"
      - "tests/services-phase42-staging-inventory.test.mjs"
      - "scripts/services-phase43-trusted-admin-foundation.mjs"
      - "tests/services-phase43-trusted-admin-foundation.test.mjs"
      - "scripts/sql/services-staging-trusted-admin-foundation-candidate.sql"
      - "docs/sql/eternyx/services-phase44-disposable-*.sql"
      - "tests/services-phase44-staging-foundation.test.mjs"
      - "scripts/services-phase45-pinned-rollout.mjs"
      - "scripts/services-phase45-rollout-manifest.json"
      - "tests/services-phase45-pinned-rollout.test.mjs"
      - "scripts/services-phase47-recorded-sql-review.mjs"
      - "scripts/sql/services-staging-acceptance-fixtures-candidate.sql"
      - "scripts/sql/services-staging-auditor-candidate.sql"
      - "docs/sql/eternyx/services-phase47-disposable-fixture-acceptance.sql"
      - "tests/services-phase47-real-acceptance-readiness.test.mjs"
      - "docs/ETERNYX_SERVICES_LIVE_ACCEPTANCE_PHASE47.md"
      - "docs/sql/eternyx/services-phase45-staging-default-acl-assert.sql"
      - "docs/ETERNYX_SERVICES_PINNED_ROLLOUT_PHASE45.md"
      - "docs/ETERNYX_SERVICES_STAGING_FOUNDATION_PHASE44.md"
      - "docs/ETERNYX_SERVICES_TRUSTED_ADMIN_FOUNDATION_PHASE43.md"
      - ".github/workflows/services-staging-readonly-inventory.yml"
      - ".github/workflows/services-staging-acceptance.yml"
      - ".github/workflows/services-pg17-disposable-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-pg17-disposable-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-replay:
    name: Replay 13 Services migrations inside networkless disposable PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source code only
        uses: actions/checkout@v4

      - name: Install Node 22 for deterministic local plan
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prove reviewed migration integrity and write ordered plan
        run: |
          node scripts/services-migration-source-guard.mjs > "$RUNNER_TEMP/services-source-verdict.json"
          node --test tests/services-pg17-replay-plan.test.mjs tests/services-pg17-role-isolation-phase30.test.mjs tests/services-pg17-catalog-verdict-phase32.test.mjs tests/services-pg17-write-abuse-phase33.test.mjs tests/services-pg17-concurrency-phase34.test.mjs tests/services-phase35-managed-history-reconciler.test.mjs tests/services-phase36-staging-live-db-proof.test.mjs tests/services-phase37-auditor-privileges.test.mjs tests/services-phase38-definer-surface.test.mjs tests/services-phase39-definer-safety.test.mjs tests/services-phase40-consistent-evidence.test.mjs tests/services-phase41-registered-project.test.mjs tests/services-phase42-staging-inventory.test.mjs tests/services-phase43-trusted-admin-foundation.test.mjs tests/services-phase44-staging-foundation.test.mjs tests/services-phase45-pinned-rollout.test.mjs tests/services-phase47-real-acceptance-readiness.test.mjs
          node scripts/services-phase45-pinned-rollout.mjs --check > "$RUNNER_TEMP/services-phase45-reviewed-plan.json"
          node scripts/services-pg17-replay-plan.mjs --list > "$RUNNER_TEMP/services-isolated-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/services-isolated-files.txt")" -eq 13

      - name: Replay Services chain against disposable network-isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          name="eternyx-services-replay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --rm --network none --name "$name" \
            -e POSTGRES_PASSWORD=synthetic_ci_only postgres:17-alpine > /dev/null
          trap 'docker rm --force "$name" >/dev/null 2>&1 || true' EXIT

          # Postgres entrypoint starts a temporary initdb server and then
          # shuts it down. A single successful pg_isready can observe the
          # temporary server; demand four consecutive healthy probes.
          stable=0
          for _ in $(seq 1 60); do
            if docker exec "$name" pg_isready -q -U postgres > /dev/null 2>&1; then
              stable=$((stable + 1))
              if [ "$stable" -ge 4 ]; then break; fi
            else
              stable=0
            fi
            sleep 1
          done
          if [ "$stable" -lt 4 ]; then
            echo "Disposable PostgreSQL container did not become ready"
            exit 1
          fi

          # The bootstrap contains only synthetic auth roles and empty tables.
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < docs/sql/eternyx/services-phase29-disposable-bootstrap.sql > /dev/null

          index=0
          while IFS= read -r migration; do
            index=$((index + 1))
            case "$migration" in
              supabase/migrations/*service*.sql) ;;
              *) echo "Unrecognized migration allowlist entry"; exit 1 ;;
            esac
            test -f "$migration"
            echo "Replaying Services migration $index / 13"
            docker exec -i "$name" psql -X -1 -v ON_ERROR_STOP=1 -U postgres -d postgres \
              < "$migration" > "$RUNNER_TEMP/services-pg17-replay-output.log" 2>&1 || {
                echo "Disposable replay failed on allowlisted migration $index"
                tail -n 12 "$RUNNER_TEMP/services-pg17-replay-output.log"
                exit 1
              }
          done < "$RUNNER_TEMP/services-isolated-files.txt"
          test "$index" -eq 13
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < docs/sql/eternyx/services-phase29-disposable-catalog-assert.sql
          # Real database RLS, not regex-based policy existence checks.
          # Synthetic A/B/admin/anon fixtures roll back inside this transaction.
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < docs/sql/eternyx/services-phase30-disposable-rls-acceptance.sql
          # Replay the EXACT operator-facing Phase 27 SELECT-only catalog
          # verdict; reject six deliberately weakened schema permissions/
          # policies/triggers. Every mutation has its own ROLLBACK.
          node scripts/services-pg17-catalog-verdict-regressions.mjs --stdout \
            > "$RUNNER_TEMP/services-phase32-catalog-regressions.sql"
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < "$RUNNER_TEMP/services-phase32-catalog-regressions.sql"
          # Execute real SQL write-path attacks and owner/admin limits.
          # The synthetic A/B/admin/anon fixtures and all writes roll back.
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < docs/sql/eternyx/services-phase33-disposable-write-abuse.sql
          # Real multi-session SQL races. Wrapper independently verifies
          # Docker --network none, no published ports, genuine concurrent
          # advisory lock waiters and exact trigger-generated denials.
          bash scripts/services-pg17-concurrency-ci.sh "$name"
          # Phase 37: real PostgreSQL privilege mutations on a disposable
          # SQL-only staging auditor role. The role, grants and sequence
          # exist solely inside --network none CI and are dropped after.
          node scripts/services-phase37-auditor-privilege-replay.mjs --stdout \
            > "$RUNNER_TEMP/services-phase37-auditor-privilege-regressions.sql"
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < "$RUNNER_TEMP/services-phase37-auditor-privilege-regressions.sql"
          # Phase 38: actual synthetic callable elevated-routine and private
          # schema exposure tests using the same isolated PG17 container.
          node scripts/services-phase38-definer-mutation-replay.mjs --stdout \
            > "$RUNNER_TEMP/services-phase38-definer-mutations.sql"
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < "$RUNNER_TEMP/services-phase38-definer-mutations.sql"
          # Phase 39: actual nonvolatile definer EXECUTE, unsafe client
          # search_path and privileged trigger negative controls.
          node scripts/services-phase39-definer-mutation-replay.mjs --stdout \
            > "$RUNNER_TEMP/services-phase39-definer-mutations.sql"
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < "$RUNNER_TEMP/services-phase39-definer-mutations.sql"
          # Phase 43: execute the SAME read-only trusted-admin foundation
          # catalog query against genuine networkless PG17 (no remote Auth).
          # The synthetic bootstrap mirrors the reviewed trusted-admin
          # grant/RLS contract, and all twelve metadata facts must be true.
          node --input-type=module -e "import {buildFoundationSql} from './scripts/services-phase43-trusted-admin-foundation.mjs';process.stdout.write(buildFoundationSql())" \
            > "$RUNNER_TEMP/services-phase43-foundation.sql"
          docker exec -i "$name" psql -X -q -A -t -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < "$RUNNER_TEMP/services-phase43-foundation.sql" \
            > "$RUNNER_TEMP/services-phase43-foundation.json"
          node --input-type=module -e "import {readFileSync} from 'node:fs';import {analyzeServicesFoundation} from './scripts/services-phase43-trusted-admin-foundation.mjs';const r=analyzeServicesFoundation(readFileSync(process.argv[1],'utf8'));if(r.factsPassed!==12||r.state!=='eligible_for_separate_reviewed_staging_deployment'){process.stderr.write('Phase43 synthetic missing fact IDs: '+r.missingSourceDefinedRequirements.join(',')+'\\n');throw Error('Phase43 disposable foundation check failed')}" \
            "$RUNNER_TEMP/services-phase43-foundation.json"
          # Phase44: a second database in the SAME networkless container.
          # Apply the exact unseeded staging candidate, not the old synthetic
          # trusted-admin bootstrap. Deliberately test default ACL inheritance.
          docker exec "$name" createdb -U postgres services_phase44
          docker exec -i "$name" psql -X -1 -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            < docs/sql/eternyx/services-phase44-disposable-auth-primitives.sql
          docker exec -i "$name" psql -X -1 -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            < scripts/sql/services-staging-trusted-admin-foundation-candidate.sql
          docker exec -i "$name" psql -X -q -A -t -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            < "$RUNNER_TEMP/services-phase43-foundation.sql" > "$RUNNER_TEMP/services-phase44-foundation.json"
          node --input-type=module -e "import {readFileSync} from 'node:fs';import {analyzeServicesFoundation} from './scripts/services-phase43-trusted-admin-foundation.mjs';const r=analyzeServicesFoundation(readFileSync(process.argv[1],'utf8'));if(r.factsPassed!==12)throw Error('Phase44 missing '+r.missingSourceDefinedRequirements.join(','))" \
            "$RUNNER_TEMP/services-phase44-foundation.json"
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            < docs/sql/eternyx/services-phase44-disposable-admin-acceptance.sql
          # Phase45: retain the live staging-shaped public default ACLs
          # throughout the entire 13-file replay; do not normalize defaults.
          # The same SQL candidate must refuse an occupied foundation.
          if docker exec -i "$name" psql -X -1 -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
              < scripts/sql/services-staging-trusted-admin-foundation-candidate.sql > "$RUNNER_TEMP/services-phase44-repeat.log" 2>&1; then
            echo "Phase44 candidate unexpectedly accepted occupied foundation"; exit 1
          fi
          grep -q 'relation "admin_users" already exists' "$RUNNER_TEMP/services-phase44-repeat.log"
          # Prove the 13 exact source migrations work with the new candidate.
          index44=0
          while IFS= read -r migration; do
            index44=$((index44 + 1))
            case "$migration" in supabase/migrations/*service*.sql) ;; *) exit 1 ;; esac
            docker exec -i "$name" psql -X -1 -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
              < "$migration" > "$RUNNER_TEMP/services-phase44-replay.log" 2>&1 || {
                echo "Phase44 exact candidate replay failed on migration $index44"; tail -n 12 "$RUNNER_TEMP/services-phase44-replay.log"; exit 1
              }
          done < "$RUNNER_TEMP/services-isolated-files.txt"
          test "$index44" -eq 13
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            < docs/sql/eternyx/services-phase29-disposable-catalog-assert.sql
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            < docs/sql/eternyx/services-phase30-disposable-rls-acceptance.sql
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            < docs/sql/eternyx/services-phase45-staging-default-acl-assert.sql
          docker exec -i "$name" psql -X -q -A -t -F '|' -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            < docs/sql/eternyx/services-phase27-readonly-catalog-verdict.sql > "$RUNNER_TEMP/services-phase45-catalog.txt"
          grep -q '^t|64|0|{}|' "$RUNNER_TEMP/services-phase45-catalog.txt" || {
            echo "Phase45 64-check catalog failed under staging-shaped defaults"; exit 1;
          }
          echo "PASS: Phase45 exact pinned rollout and 64-check catalog under retained staging-shaped default ACLs"
          # Phase47: existing empty disposable Auth schema, three synthetic
          # identities, then the EXACT reviewed staging fixture candidate.
          docker exec "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            -c "INSERT INTO auth.users(id) VALUES ('11111111-1111-4111-8111-111111111111'),('22222222-2222-4222-8222-222222222222'),('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');"
          fixture_args=(-v customer_a_id=11111111-1111-4111-8111-111111111111
            -v customer_b_id=22222222-2222-4222-8222-222222222222
            -v admin_id=aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
            -v request_a_id=33333333-3333-4333-8333-333333333333
            -v request_b_id=44444444-4444-4444-8444-444444444444)
          if docker exec -i "$name" psql -X -1 -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
              "${fixture_args[@]}" -v fixture_approval=NOT_APPROVED \
              -f - < scripts/sql/services-staging-acceptance-fixtures-candidate.sql > "$RUNNER_TEMP/services-phase47-denied.log" 2>&1; then
            echo "Phase47 fixture without approval unexpectedly succeeded"; exit 1
          fi
          grep -q 'Services fixture approval missing' "$RUNNER_TEMP/services-phase47-denied.log"
          docker exec -i "$name" psql -X -1 -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            "${fixture_args[@]}" -v fixture_approval=SEED_DEDICATED_SERVICES_STAGING_FIXTURES \
            -f - < scripts/sql/services-staging-acceptance-fixtures-candidate.sql
          docker exec -i "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            < docs/sql/eternyx/services-phase47-disposable-fixture-acceptance.sql
          if docker exec -i "$name" psql -X -1 -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
              "${fixture_args[@]}" -v fixture_approval=SEED_DEDICATED_SERVICES_STAGING_FIXTURES \
              -f - < scripts/sql/services-staging-acceptance-fixtures-candidate.sql > "$RUNNER_TEMP/services-phase47-repeat.log" 2>&1; then
            echo "Phase47 fixture repeat unexpectedly succeeded"; exit 1
          fi
          grep -q 'Services fixture target is not empty' "$RUNNER_TEMP/services-phase47-repeat.log"
          # Prove auditor candidate grants are column-scoped, with no login.
          docker exec "$name" psql -X -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            -c 'CREATE SCHEMA supabase_migrations; CREATE TABLE supabase_migrations.schema_migrations(version text PRIMARY KEY,name text,statements text[]);'
          docker exec -i "$name" psql -X -1 -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            < scripts/sql/services-staging-auditor-candidate.sql
          docker exec "$name" psql -X -q -A -t -v ON_ERROR_STOP=1 -U postgres -d services_phase44 \
            -c "SELECT NOT rolcanlogin AND NOT rolbypassrls AND NOT rolinherit AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND has_column_privilege(rolname,'supabase_migrations.schema_migrations','version','SELECT') AND has_column_privilege(rolname,'supabase_migrations.schema_migrations','name','SELECT') AND NOT has_column_privilege(rolname,'supabase_migrations.schema_migrations','statements','SELECT') AND NOT has_table_privilege(rolname,'public.service_requests','SELECT') AND NOT has_function_privilege(rolname,'public.is_admin()','EXECUTE') FROM pg_roles WHERE rolname='services_staging_auditor';" \
            | grep -qx t
          echo "PASS: Phase47 exact fixture candidate, isolated roles, duplicate refusal and NOLOGIN auditor ACL"
          echo "PASS: Phase44 exact seedless candidate and complete 13-file Services chain with synthetic RLS acceptance"
          echo "PASS: isolated Services PG17 migrations, RLS, concurrency, auditor privilege and hardened SECURITY DEFINER checks (no remote deployment)"

      # No Supabase secrets, no linked project, no production/staging database
      # connection and no artifact upload containing DB rows.
