name: Workspace Ownership and Revision PostgreSQL Acceptance

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261123050000_workspace_owner_projects_tasks_items.sql'
      - 'supabase/migrations/20261123180000_workspace_revision_history_and_archive_guards.sql'
      - 'supabase/migrations/20261124010000_workspace_owner_quotas_and_pinned.sql'
      - 'supabase/migrations/20261124030000_workspace_task_priorities_and_safe_purge.sql'
      - 'supabase/migrations/20261124050000_workspace_task_details_checklists.sql'
      - 'supabase/migrations/20261124070000_workspace_checklist_restore_batches.sql'
      - 'supabase/migrations/20261124090000_workspace_import_sessions.sql'
      - 'supabase/migrations/20261124110000_workspace_import_recovery_review_and_discard.sql'
      - 'supabase/migrations/20261124130000_workspace_import_protection_and_integrity.sql'
      - 'supabase/migrations/20261124150000_workspace_reconciliation_receipts.sql'
      - 'supabase/migrations/20261124170000_workspace_team_spaces.sql'
      - 'supabase/migrations/20261124190000_workspace_team_discussions_checklists.sql'
      - 'supabase/migrations/20261124210000_workspace_team_realtime_notifications.sql'
      - 'tests/sql/workspace-owner-quotas-db-smoke.sql'
      - 'tests/sql/workspace-priority-archive-purge-db-smoke.sql'
      - 'tests/sql/workspace-task-checklists-db-smoke.sql'
      - 'tests/sql/workspace-checklist-restore-db-smoke.sql'
      - 'tests/sql/workspace-import-recovery-db-smoke.sql'
      - 'tests/sql/workspace-import-review-discard-db-smoke.sql'
      - 'tests/sql/workspace-import-protection-db-smoke.sql'
      - 'tests/sql/workspace-reconciliation-receipts-db-smoke.sql'
      - 'tests/sql/workspace-release-drill-db-smoke.sql'
      - 'tests/sql/workspace-team-spaces-db-smoke.sql'
      - 'tests/sql/workspace-team-discussions-checklists-db-smoke.sql'
      - 'tests/sql/workspace-team-realtime-notifications-db-smoke.sql'
      - 'tests/sql/workspace-revisions-bootstrap.sql'
      - 'tests/sql/workspace-revisions-db-smoke.sql'
      - '.github/workflows/workspace-revisions-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-acceptance:
    name: Verify Workspace revisions, owner isolation and archived read-only on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start network-isolated disposable PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-workspace-test -e POSTGRES_PASSWORD=local_ci_only postgres:17-alpine
          stable=0
          for i in $(seq 1 45); do
            if docker exec eternyx-workspace-test pg_isready -U postgres >/dev/null 2>&1; then
              stable=$((stable+1))
              if [ "$stable" -ge 4 ]; then break; fi
            else
              stable=0
            fi
            sleep 1
          done
          docker exec eternyx-workspace-test pg_isready -U postgres
      - name: Bootstrap test auth and Storage schemas (not production)
        run: |
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-revisions-bootstrap.sql
      - name: Apply Workspace foundation and revision migrations
        run: |
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123050000_workspace_owner_projects_tasks_items.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123180000_workspace_revision_history_and_archive_guards.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124010000_workspace_owner_quotas_and_pinned.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124030000_workspace_task_priorities_and_safe_purge.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124050000_workspace_task_details_checklists.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124070000_workspace_checklist_restore_batches.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124090000_workspace_import_sessions.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124110000_workspace_import_recovery_review_and_discard.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124130000_workspace_import_protection_and_integrity.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124150000_workspace_reconciliation_receipts.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124170000_workspace_team_spaces.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124190000_workspace_team_discussions_checklists.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124210000_workspace_team_realtime_notifications.sql
      - name: Verify actual ownership, revision history, audit and archive invariants
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-revisions-db-smoke.sql
      - name: Verify owner caps, pinned RLS and Storage registration metadata
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-owner-quotas-db-smoke.sql
      - name: Verify safe owner-only archived project purge and task priority constraints
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-priority-archive-purge-db-smoke.sql
      - name: Verify checklist RLS, completion timestamps, quotas and archive guards
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-task-checklists-db-smoke.sql
      - name: Verify atomic v3 checklist restore, task identity mapping and owner isolation
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-checklist-restore-db-smoke.sql
      - name: Verify resumable owner-only imports, deterministic file claims and idempotency
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-import-recovery-db-smoke.sql
      - name: Verify private recovery inspection, two-step empty discard and fail-closed deletion
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-import-review-discard-db-smoke.sql
      - name: Verify owner-held partial imports, content drift and safe resume checkpoints
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-import-protection-db-smoke.sql
      - name: Verify immutable private reconciliation preparation receipts and cross-owner isolation
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-reconciliation-receipts-db-smoke.sql
      - name: Run Phase 16 synthetic complete restore, interruption and tenant-isolation drill
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-release-drill-db-smoke.sql
      - name: Verify Phase 17 team invitations, role separation, assignments and private project isolation
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-team-spaces-db-smoke.sql
      - name: Verify Phase 18 comment, checklist, assignment, viewer and outsider security boundaries
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-team-discussions-checklists-db-smoke.sql
      - name: Verify Phase 19 notification receipt isolation, event membership and no forged browser writes
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-team-realtime-notifications-db-smoke.sql
      - name: Dispose PostgreSQL
        if: always()
        run: docker rm --force eternyx-workspace-test || true
