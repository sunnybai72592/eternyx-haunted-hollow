name: Workspace Ownership and Revision PostgreSQL Acceptance

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261123050000_workspace_owner_projects_tasks_items.sql'
      - 'supabase/migrations/20261123180000_workspace_revision_history_and_archive_guards.sql'
      - 'supabase/migrations/20261124010000_workspace_owner_quotas_and_pinned.sql'
      - 'supabase/migrations/20261124030000_workspace_task_priorities_and_safe_purge.sql'
      - 'tests/sql/workspace-owner-quotas-db-smoke.sql'
      - 'tests/sql/workspace-priority-archive-purge-db-smoke.sql'
      - 'tests/sql/workspace-revisions-bootstrap.sql'
      - 'tests/sql/workspace-revisions-db-smoke.sql'
      - '.github/workflows/workspace-revisions-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-acceptance:
    name: Verify Workspace revisions, owner isolation and archived read-only on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start network-isolated disposable PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-workspace-test -e POSTGRES_PASSWORD=local_ci_only postgres:17-alpine
          stable=0
          for i in $(seq 1 45); do
            if docker exec eternyx-workspace-test pg_isready -U postgres >/dev/null 2>&1; then
              stable=$((stable+1))
              if [ "$stable" -ge 4 ]; then break; fi
            else
              stable=0
            fi
            sleep 1
          done
          docker exec eternyx-workspace-test pg_isready -U postgres
      - name: Bootstrap test auth and Storage schemas (not production)
        run: |
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-revisions-bootstrap.sql
      - name: Apply Workspace foundation and revision migrations
        run: |
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123050000_workspace_owner_projects_tasks_items.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123180000_workspace_revision_history_and_archive_guards.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124010000_workspace_owner_quotas_and_pinned.sql
          docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261124030000_workspace_task_priorities_and_safe_purge.sql
      - name: Verify actual ownership, revision history, audit and archive invariants
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-revisions-db-smoke.sql
      - name: Verify owner caps, pinned RLS and Storage registration metadata
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-owner-quotas-db-smoke.sql
      - name: Verify safe owner-only archived project purge and task priority constraints
        run: docker exec --interactive eternyx-workspace-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/workspace-priority-archive-purge-db-smoke.sql
      - name: Dispose PostgreSQL
        if: always()
        run: docker rm --force eternyx-workspace-test || true
