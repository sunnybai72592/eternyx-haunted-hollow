name: ETERNYX four missing backend functions isolated staging release

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Only an independently approved isolated staging Supabase project. Never production."
        type: choice
        required: true
        options:
          - NOT_APPROVED
          - I_APPROVE_STAGING_CORE_FUNCTION_RELEASE
        default: NOT_APPROVED
      database_and_secret_review:
        description: "Owner verified staging-only migration history, schema, keys and rollback readiness."
        type: choice
        required: true
        options:
          - NOT_REVIEWED
          - STAGING_SCHEMA_SECRETS_AND_ROLLBACK_REVIEWED
        default: NOT_REVIEWED
      verified_ctf_secret_review:
        description: "Reviewed a new staging-only CTF_FLAG_SECRET of at least 32 UTF-8 bytes and CTF rollback readiness."
        type: choice
        required: true
        options:
          - NOT_REVIEWED
          - STAGING_CTF_FLAG_SECRET_REVIEWED
        default: NOT_REVIEWED

permissions:
  contents: read
concurrency:
  group: eternyx-automation-staging-core-release
  cancel-in-progress: false

jobs:
  release-staging-core:
    if: "${{ github.ref == 'refs/heads/main' && inputs.approval == 'I_APPROVE_STAGING_CORE_FUNCTION_RELEASE' && inputs.database_and_secret_review == 'STAGING_SCHEMA_SECRETS_AND_ROLLBACK_REVIEWED' && inputs.verified_ctf_secret_review == 'STAGING_CTF_FLAG_SECRET_REVIEWED' }}"
    name: Prove staging Automation + CTF schemas then publish exactly four backend functions
    environment: automation-staging
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ETERNYX_AUTOMATION_STAGING_DB_CONSENT: I_APPROVE_READONLY_ISOLATED_STAGING
      ETERNYX_AUTOMATION_STAGING_REF: "${{ vars.ETERNYX_AUTOMATION_STAGING_REF }}"
      ETERNYX_AUTOMATION_PRODUCTION_REF: wcncuarekaofmfurbtbh
      ETERNYX_AUTOMATION_STAGING_PGHOST: "${{ vars.ETERNYX_AUTOMATION_STAGING_PGHOST }}"
      ETERNYX_AUTOMATION_STAGING_PGUSER: "${{ vars.ETERNYX_AUTOMATION_STAGING_PGUSER }}"
      ETERNYX_AUTOMATION_STAGING_PGPORT: "5432"
      ETERNYX_AUTOMATION_STAGING_PGDATABASE: postgres
    steps:
      - name: Check out immutable reviewed main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22 for local safety checks only
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated stage target, all required function source handlers and explicit JWT policy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/automation-staging-core-release.mjs --check-target > /dev/null
          node scripts/automation-staging-core-release.mjs --check-source > "$RUNNER_TEMP/automation-core-source.json"
          node scripts/eternyx-missing-backend-release.mjs --check-source > "$RUNNER_TEMP/eternyx-four-function-source.json"
      - name: Query the actual STAGING migration journal through authenticated TLS and READ ONLY transaction
        env:
          ETERNYX_AUTOMATION_STAGING_PGPASSWORD: "${{ secrets.ETERNYX_AUTOMATION_STAGING_PGPASSWORD }}"
          ETERNYX_AUTOMATION_STAGING_CA_PEM: "${{ secrets.ETERNYX_AUTOMATION_STAGING_CA_PEM }}"
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          bash scripts/automation-staging-db-readonly.sh > "$RUNNER_TEMP/automation-staging-db-evidence.json"
          bash scripts/automation-staging-functions-catalog.sh > "$RUNNER_TEMP/automation-staging-catalog-evidence.json"
          bash scripts/eternyx-staging-ctf-catalog.sh > "$RUNNER_TEMP/eternyx-ctf-staging-catalog.json"
      - name: Refuse release unless true read-only staging database and seven RPC/four RLS prerequisites are present
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/automation-staging-db-evidence.json" "$RUNNER_TEMP/automation-staging-catalog-evidence.json" <<'NODE'
          import {readFileSync} from "node:fs";
          import {validateTarget,validateStageProbe,validateCatalogReport} from "./scripts/automation-staging-core-release.mjs";
          const target=validateTarget(process.env);
          const db=JSON.parse(readFileSync(process.argv[2],"utf8"));
          const catalog=JSON.parse(readFileSync(process.argv[3],"utf8"));
          validateStageProbe(db,target);
          validateCatalogReport(catalog);
          console.log("Staging read-only database, required Automation schema, RPC presence and tenant RLS prerequisites verified.");
          NODE
      - name: Refuse deployment unless verified CTF solves, attempt rate limit, RLS, and service-only RPC are present
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/eternyx-ctf-staging-catalog.json" <<'NODE'
          import {readFileSync} from "node:fs";
          import {verifyCtfCatalog} from "./scripts/eternyx-missing-backend-release.mjs";
          verifyCtfCatalog(JSON.parse(readFileSync(process.argv[2],"utf8")));
          console.log("Isolated staging CTF schema, RLS and server-only verification RPC verified; secret values never read by CI.");
          NODE
      - name: Install reviewed Supabase CLI v3.1.0
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Prove management API target is a separate healthy project in the ETERNYX organization
        env:
          SUPABASE_ACCESS_TOKEN: "${{ secrets.ETERNYX_AUTOMATION_STAGING_MANAGEMENT_TOKEN }}"
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {validateTarget,fetchStageManagement,inspectStageProject} from "./scripts/automation-staging-core-release.mjs";
          const target=validateTarget(process.env);
          const data=await fetchStageManagement(
            "https://api.supabase.com/v1/projects/"+target.stagingRef,
            process.env.SUPABASE_ACCESS_TOKEN,
          );
          inspectStageProject(data,target.stagingRef);
          console.log("Management API independently confirms the isolated, healthy staging project in the expected organization.");
          NODE
      - name: Deploy exactly four reviewed missing backend functions to isolated staging
        shell: bash
        timeout-minutes: 6
        env:
          SUPABASE_ACCESS_TOKEN: "${{ secrets.ETERNYX_AUTOMATION_STAGING_MANAGEMENT_TOKEN }}"
        run: |
          set -euo pipefail
          node scripts/automation-staging-core-release.mjs --check-target >/dev/null
          target="$ETERNYX_AUTOMATION_STAGING_REF"
          # Explicit CLI v3 remote target; never deploy all Functions and never prune.
          supabase functions deploy automation-control --remote="$target" --yes
          supabase functions deploy automation-webhook --remote="$target" --yes --no-verify-jwt
          supabase functions deploy automation-scheduler-worker --remote="$target" --yes --no-verify-jwt
          # Verified CTF is always user-authenticated; never disable the gateway JWT check.
          supabase functions deploy ctf-verified --remote="$target" --yes
      - name: Verify active deployed versions and exact JWT policies from staging Management API
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: "${{ secrets.ETERNYX_AUTOMATION_STAGING_MANAGEMENT_TOKEN }}"
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/automation-staging-core-deployed.json" <<'NODE'
          import {writeFileSync} from "node:fs";
          import {validateTarget,fetchStageManagement} from "./scripts/automation-staging-core-release.mjs";
          import {verifyFourInventory} from "./scripts/eternyx-missing-backend-release.mjs";
          const target=validateTarget(process.env);
          const raw=await fetchStageManagement(
            "https://api.supabase.com/v1/projects/"+target.stagingRef+"/functions",
            process.env.SUPABASE_ACCESS_TOKEN,
          );
          const inventory=verifyFourInventory(raw);
          writeFileSync(process.argv[2],JSON.stringify({
            schema:"eternyx-automation-staging-core-inventory-v1",
            target:"isolated_staging",
            stagingRef:target.stagingRef,
            coreFunctions:inventory,
            stagedFunctionsActive:true,
            verifiedCtfFunctionPresent:true,
            ctfFlagSecretConfirmedByOperatorOnly:true,
            liveBusinessFlowsVerified:false,
            secretsValidatedByRuntime:false,
            webhooksActivated:false,
            scheduleActivated:false,
            productionDeployment:false,
            productionReleaseAuthorized:false,
          },null,2)+"\n",{mode:0o600,flag:"wx"});
          console.log("Four staging backend functions ACTIVE with expected JWT policies. Real user flows and runtime secrets remain unverified.");
          NODE
      - name: Exercise five negative-only staging HTTP denials after deployed function inventory succeeds
        shell: bash
        timeout-minutes: 2
        env:
          ETERNYX_AUTOMATION_NEGATIVE_HTTP_CONSENT: I_APPROVE_STAGING_NEGATIVE_HTTP
        run: |
          set -euo pipefail
          node scripts/automation-staging-negative-http.mjs --run-negative-only > "$RUNNER_TEMP/eternyx-staging-negative-http.json"
          echo "Staging core HTTP unauthorized access correctly denied without valid credentials or execution requests."
      - name: Publish sanitized staging negative HTTP evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eternyx-automation-core-staging-http-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eternyx-staging-negative-http.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish sanitized staged-function inventory only (no secrets or customer data)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eternyx-automation-staging-core-versions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/automation-staging-core-deployed.json
          if-no-files-found: error
          retention-days: 7
