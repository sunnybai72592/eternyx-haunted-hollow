name: Automation Scheduled Worker SQL Acceptance

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261122220000_automation_manual_control_plane.sql'
      - 'supabase/migrations/20261122230000_automation_signed_webhook_triggers.sql'
      - 'supabase/migrations/20261122234500_automation_scheduled_runs.sql'
      - 'tests/sql/automation-scheduler-db-smoke.sql'
      - 'tests/sql/ctf-range-db-bootstrap.sql'
      - '.github/workflows/automation-scheduler-sql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    name: Verify scheduler leases, quotas, tenant boundaries and retries on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable network-isolated PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-scheduler-ci -e POSTGRES_PASSWORD=local_ci_only postgres:17-alpine
          stable=0
          for i in $(seq 1 45); do
            if docker exec eternyx-scheduler-ci pg_isready -U postgres >/dev/null 2>&1; then
              stable=$((stable+1))
              if [ "$stable" -ge 4 ]; then break; fi
            else
              stable=0
            fi
            sleep 1
          done
          docker exec eternyx-scheduler-ci pg_isready -U postgres || {
            docker logs eternyx-scheduler-ci
            exit 1
          }
      - name: Bootstrap Auth roles and fixture identities
        run: docker exec --interactive eternyx-scheduler-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
      - name: Apply manual run migration
        run: docker exec --interactive eternyx-scheduler-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261122220000_automation_manual_control_plane.sql
      - name: Apply signed webhook dependency
        run: docker exec --interactive eternyx-scheduler-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261122230000_automation_signed_webhook_triggers.sql
      - name: Apply scheduled runs migration
        run: docker exec --interactive eternyx-scheduler-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261122234500_automation_scheduled_runs.sql
      - name: Verify owner isolation, leases, quota deferral, retry limits and output access
        run: docker exec --interactive eternyx-scheduler-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/automation-scheduler-db-smoke.sql
      - name: Remove disposable PostgreSQL instance
        if: always()
        run: docker rm --force eternyx-scheduler-ci || true
