name: AI Video GPU Worker Tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "gpu-worker/**"
      - ".github/workflows/gpu-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "gpu-worker/**"
      - ".github/workflows/gpu-worker.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    name: Private GPU worker offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check syntax and imports
        run: python -m compileall -q gpu-worker
      - name: Exercise queue, recovery, API and authentication
        run: python -m unittest discover -s gpu-worker/tests -p 'test_*.py' -v
