name: Automation Observability, Audits and Safe Quarantine SQL Acceptance

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261123080000_automation_observability_recovery.sql'
      - 'tests/sql/automation-observability-recovery-db-smoke.sql'
      - '.github/workflows/automation-observability-recovery-sql.yml'
      - 'tests/sql/ctf-range-db-bootstrap.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    name: Verify factual metrics, private audit snapshots and no-retry schedule quarantine on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Start networkless disposable PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-audit-ci -e POSTGRES_PASSWORD=local_ci_only postgres:17-alpine
          stable=0
          for i in $(seq 1 45); do
            if docker exec eternyx-audit-ci pg_isready -U postgres >/dev/null 2>&1; then
              stable=$((stable+1))
              if [ "$stable" -ge 4 ]; then break; fi
            else
              stable=0
            fi
            sleep 1
          done
          docker exec eternyx-audit-ci pg_isready -U postgres || { docker logs eternyx-audit-ci; exit 1; }
      - name: Bootstrap two fixture owner accounts
        run: docker exec --interactive eternyx-audit-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
      - name: Apply previous Automation workflows and Phase 2L migration
        run: |
          for file in \
            supabase/migrations/20261122220000_automation_manual_control_plane.sql \
            supabase/migrations/20261122230000_automation_signed_webhook_triggers.sql \
            supabase/migrations/20261122234500_automation_scheduled_runs.sql \
            supabase/migrations/20261123000000_automation_webhook_approvals.sql \
            supabase/migrations/20261123060000_automation_workflow_policies.sql \
            supabase/migrations/20261123070000_automation_operations.sql \
            supabase/migrations/20261123080000_automation_observability_recovery.sql; do
            docker exec --interactive eternyx-audit-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Assert owner-only observability, capped exports and lease fencing
        run: docker exec --interactive eternyx-audit-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/automation-observability-recovery-db-smoke.sql
      - name: Remove disposable PostgreSQL
        if: always()
        run: docker rm --force eternyx-audit-ci || true
