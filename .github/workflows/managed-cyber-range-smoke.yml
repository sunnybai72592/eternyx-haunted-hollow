name: Managed Cyber Range Isolation Smoke

on:
  pull_request:
    paths:
      - 'infrastructure/cyber-range/**'
      - 'scripts/cyber-range-host-smoke.mjs'
      - 'supabase/functions/_shared/ctf-range-worker-contract.mjs'
      - '.github/workflows/managed-cyber-range-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-isolation:
    name: Verify two internal-only Linux Docker labs with trusted host loopback ingress
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify host-only ingress, two private labs, quota and egress isolation
        env:
          ETERNYX_PROVIDER_EXECUTION: enabled
          ETERNYX_RANGE_OPERATOR_ACK: LOCAL_ONLY_NO_PUBLIC_INGRESS
          ETERNYX_RANGE_HOST_SMOKE: CI_DISPOSABLE_ONLY
        run: node scripts/cyber-range-host-smoke.mjs
      - name: Verify no managed lab containers remain on disposable host
        if: always()
        run: |
          if test -n "$(docker ps -a -q --filter label=org.eternyx.range.managed=v1)"; then
            echo 'Managed Docker labs survived disposable acceptance; inspect leaked project' >&2
            docker ps -a --filter label=org.eternyx.range.managed=v1 --format '{{.ID}} {{.Names}}'
            exit 1
          fi
