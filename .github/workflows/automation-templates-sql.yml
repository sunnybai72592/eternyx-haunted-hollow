name: Automation Curated Template and Private Preview SQL Acceptance

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261123050000_automation_template_gallery.sql'
      - 'tests/sql/automation-template-gallery-db-smoke.sql'
      - '.github/workflows/automation-templates-sql.yml'
      - 'tests/sql/ctf-range-db-bootstrap.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    name: Verify curated templates, private preview quota, owner isolation and replay on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable network-isolated PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-templates-ci -e POSTGRES_PASSWORD=local_ci_only postgres:17-alpine
          stable=0
          for i in $(seq 1 45); do
            if docker exec eternyx-templates-ci pg_isready -U postgres >/dev/null 2>&1; then
              stable=$((stable+1))
              if [ "$stable" -ge 4 ]; then break; fi
            else
              stable=0
            fi
            sleep 1
          done
          docker exec eternyx-templates-ci pg_isready -U postgres || {
            docker logs eternyx-templates-ci
            exit 1
          }
      - name: Bootstrap two fixture accounts
        run: docker exec --interactive eternyx-templates-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
      - name: Apply existing workflow, signed-trigger, schedule and template migrations
        run: |
          for file in \
            supabase/migrations/20261122220000_automation_manual_control_plane.sql \
            supabase/migrations/20261122230000_automation_signed_webhook_triggers.sql \
            supabase/migrations/20261122234500_automation_scheduled_runs.sql \
            supabase/migrations/20261123050000_automation_template_gallery.sql; do
            docker exec --interactive eternyx-templates-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Verify curated recipe copies, duplicate safety and no-side-effect private previews
        run: docker exec --interactive eternyx-templates-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/automation-template-gallery-db-smoke.sql
      - name: Remove disposable PostgreSQL
        if: always()
        run: docker rm --force eternyx-templates-ci || true
