name: Docker integrated HTTP and PostgreSQL security acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/docker-http-postgres-integration.yml'
      - 'tests/docker-http-postgres-integration.test.mjs'
      - 'tests/sql/ctf-range-db-bootstrap.sql'
      - 'supabase/functions/_shared/docker-dispatch-handler.mjs'
      - 'supabase/functions/_shared/docker-action-verifier.mjs'
      - 'supabase/functions/_shared/docker-command-contract.mjs'
      - 'supabase/functions/docker-command-dispatch/index.ts'
      - 'supabase/migrations/20261123030000_docker_workspace_enrollment.sql'
      - 'supabase/migrations/20261123040000_docker_agent_signed_reports.sql'
      - 'supabase/migrations/20261123050000_docker_operation_review.sql'
      - 'supabase/migrations/20261123070000_docker_signed_command_dispatch.sql'
      - 'supabase/migrations/20261123080000_docker_dispatch_receipt_recovery.sql'
      - 'supabase/migrations/20261123090000_docker_lab_incident_triage.sql'
      - 'supabase/migrations/20261123100000_docker_incident_containment.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-postgres:
    name: Real Ed25519 HTTP dispatch backed by actual isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start disposable network-isolated PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-docker-postgres-http-ci -e POSTGRES_PASSWORD=isolated_ci_only postgres:17-alpine
          for i in $(seq 1 45); do
            if docker exec eternyx-docker-postgres-http-ci pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec eternyx-docker-postgres-http-ci pg_isready -U postgres
      - name: Bootstrap synthetic authentication roles and owners
        run: docker exec --interactive eternyx-docker-postgres-http-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
      - name: Apply real Docker migrations to temporary database
        run: |
          for file in \
            supabase/migrations/20261123030000_docker_workspace_enrollment.sql \
            supabase/migrations/20261123040000_docker_agent_signed_reports.sql \
            supabase/migrations/20261123050000_docker_operation_review.sql \
            supabase/migrations/20261123070000_docker_signed_command_dispatch.sql \
            supabase/migrations/20261123080000_docker_dispatch_receipt_recovery.sql \
            supabase/migrations/20261123090000_docker_lab_incident_triage.sql \
            supabase/migrations/20261123100000_docker_incident_containment.sql; do
            docker exec --interactive eternyx-docker-postgres-http-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Verify live HTTP signed claims, permits, receipts, containment and revocation
        run: node --test tests/docker-http-postgres-integration.test.mjs
      - name: Remove temporary PostgreSQL even on failure
        if: always()
        run: docker rm --force eternyx-docker-postgres-http-ci || true
