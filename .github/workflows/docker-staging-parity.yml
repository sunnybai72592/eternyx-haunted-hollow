name: Docker offline staging evidence parity and release review

on:
  pull_request:
    paths:
      - '.github/workflows/docker-staging-parity.yml'
      - 'src/lib/dockerStagingParity.mjs'
      - 'scripts/docker-staging-parity.mjs'
      - 'tests/docker-staging-parity.test.mjs'
      - 'docs/DOCKER_STAGING_PARITY.md'
      - 'src/lib/dockerStagingEvidence.mjs'
      - 'supabase/functions/_shared/docker-deployment-gate.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-parity:
    name: Offline pinned-source, signed-evidence and manual-approval safeguard tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify actual release evidence module, CLI and negative cases
        run: node --test tests/docker-staging-parity.test.mjs
