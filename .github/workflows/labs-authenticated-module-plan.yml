name: LABS authenticated guest module dependency plan
on:
  pull_request:
    paths:
      - '.github/workflows/labs-authenticated-module-plan.yml'
      - 'scripts/labs-authenticated-module-plan.py'
      - 'scripts/labs-authenticated-kernel-drivers.py'
      - 'scripts/labs-runner-kernel-provenance.py'
      - 'tests/labs-authenticated-module-plan-test.py'
  workflow_dispatch:
    inputs:
      approval:
        description: Read exact authenticated guest module metadata without loading modules or booting
        type: choice
        required: true
        options:
          - DENY
          - I_APPROVE_AUTHENTICATED_GUEST_MODULE_PLAN
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          submodules: false
      - name: Remove checkout authorization
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || test "$?" -eq 5
          rc=0
          git config --local --get-all http.https://github.com/.extraheader > /dev/null || rc=$?
          test "$rc" -eq 1
      - name: Offline provenance, driver and module plan contracts
        run: |
          python3 -B tests/labs-runner-kernel-provenance-test.py
          python3 -B tests/labs-authenticated-kernel-drivers-test.py
          python3 -B tests/labs-authenticated-module-plan-test.py
  module-plan:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approval == 'I_APPROVE_AUTHENTICATED_GUEST_MODULE_PLAN' }}
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          submodules: false
      - name: Remove checkout authorization
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || test "$?" -eq 5
          rc=0
          git config --local --get-all http.https://github.com/.extraheader > /dev/null || rc=$?
          test "$rc" -eq 1
      - name: Inspect exact authenticated module dependency closure
        run: python3 -I -B scripts/labs-authenticated-module-plan.py
