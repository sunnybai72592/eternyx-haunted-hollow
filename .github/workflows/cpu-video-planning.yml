name: CPU video planning regression

on:
  pull_request:
    paths:
      - "gpu-worker/estimate_training_time.py"
      - "gpu-worker/tests/test_estimate_training_time.py"
      - "gpu-worker/run_video_pilot.py"
      - ".github/workflows/cpu-video-planning.yml"
  push:
    branches: [main]
    paths:
      - "gpu-worker/estimate_training_time.py"
      - "gpu-worker/tests/test_estimate_training_time.py"
      - "gpu-worker/run_video_pilot.py"
      - ".github/workflows/cpu-video-planning.yml"

permissions:
  contents: read

jobs:
  estimate:
    name: Offline Python planning tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate stdlib-only CPU benchmark planner
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s gpu-worker/tests -p 'test_estimate_training_time.py' -v
