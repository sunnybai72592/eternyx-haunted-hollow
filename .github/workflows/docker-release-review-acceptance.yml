name: Docker real release review history and RLS acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/docker-release-review-acceptance.yml'
      - 'supabase/migrations/20261123110000_docker_release_review_history.sql'
      - 'supabase/functions/_shared/docker-release-review-contract.mjs'
      - 'supabase/functions/docker-control/index.ts'
      - 'src/components/docker/DockerReleaseReviewWorkspace.tsx'
      - 'src/pages/DockerControlReview.tsx'
      - 'tests/docker-release-review.test.mjs'
      - 'tests/sql/docker-release-review-db-acceptance.sql'
      - 'supabase/migrations/20261123120000_docker_reviewer_accountability_and_event_chain.sql'
      - 'src/lib/dockerReleaseHistoryIntegrity.mjs'
      - 'src/components/docker/DockerReleaseReviewerPanel.tsx'
      - 'tests/docker-independent-reviewer-integrity.test.mjs'
      - 'tests/sql/docker-independent-reviewer-db-acceptance.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-review-history:
    name: Real two-owner PostgreSQL RLS, review transitions and truthful metadata
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify strict release action contracts and real React wiring
        run: node --test tests/docker-release-review.test.mjs
      - name: Test WebCrypto SHA-256 history verifier, distinct reviewer contracts and UI
        run: node --test tests/docker-independent-reviewer-integrity.test.mjs
      - name: Start disposable offline PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-docker-release-review-ci -e POSTGRES_PASSWORD=isolated_ci_only postgres:17-alpine
          for i in $(seq 1 45); do
            if docker exec eternyx-docker-release-review-ci pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec eternyx-docker-release-review-ci pg_isready -U postgres
      - name: Bootstrap synthetic Supabase roles and users
        run: docker exec --interactive eternyx-docker-release-review-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
      - name: Apply actual release review migration
        run: docker exec --interactive eternyx-docker-release-review-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123110000_docker_release_review_history.sql
      - name: Test actual Postgres review lifecycle, service grants, two-owner RLS and history
        run: docker exec --interactive eternyx-docker-release-review-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/docker-release-review-db-acceptance.sql
      - name: Apply independent reviewer and event chain migration
        run: docker exec --interactive eternyx-docker-release-review-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123120000_docker_reviewer_accountability_and_event_chain.sql
      - name: Test owner/reviewer consent, SHA-256 history, update denial and RLS
        run: docker exec --interactive eternyx-docker-release-review-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/docker-independent-reviewer-db-acceptance.sql
      - name: Destroy disposable database
        if: always()
        run: docker rm --force eternyx-docker-release-review-ci || true
