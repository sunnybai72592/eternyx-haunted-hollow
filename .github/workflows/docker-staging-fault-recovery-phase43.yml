name: Docker Phase 43 original-journal fault and receipt-only review (NO DOCKER)

on:
  pull_request:
    paths:
      - '.github/workflows/docker-staging-fault-recovery-phase43.yml'
      - 'src/lib/dockerStagingFaultRecoveryReview.mjs'
      - 'scripts/docker-staging-fault-recovery-review.mjs'
      - 'tests/docker-staging-fault-recovery-phase43.test.mjs'
      - 'docs/DOCKER_STAGING_FAULT_RECOVERY_PHASE43.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-original-fault-history:
    name: Prove UNKNOWN holds, signed-agent original receipt fences and no-replay recovery (NO DOCKER)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check actual original-journal fault review and offline cases
        run: |
          node --check src/lib/dockerStagingFaultRecoveryReview.mjs
          node --check scripts/docker-staging-fault-recovery-review.mjs
          node --check tests/docker-staging-fault-recovery-phase43.test.mjs
      - name: Test all original crash/receipt windows plus all prior Docker safety suites without a Docker daemon
        env:
          CI: 'true'
        run: |
          node --test tests/docker-staging-fault-recovery-phase43.test.mjs
          node --test tests/docker-staging-witness-phase42.test.mjs
          node --test tests/docker-staging-lifecycle-phase41.test.mjs
          node --test tests/docker-host-challenge-ledger-phase40.test.mjs
          node --test tests/docker-signed-host-evidence-phase39.test.mjs
          node --test tests/docker-signed-host-readonly-preflight-phase38.test.mjs
          node --test tests/docker-signed-client-config-phase37.test.mjs
          node --test tests/docker-signed-cli-fd-exec-phase36.test.mjs
          node --test tests/docker-signed-cli-executable-pin.test.mjs
          node --test tests/docker-signed-normal-receipt-evidence.test.mjs
          node --test tests/docker-signed-receipt-replay-forensics.test.mjs
          node --test tests/docker-durable-journal-fsync.test.mjs
          node --test tests/docker-agent-attempt-disposition.test.mjs
          node --test tests/docker-strict-recovery-inventory.test.mjs
          node --test tests/docker-container-lock.test.mjs
          node --test tests/docker-signed-container-history-fence.test.mjs
          node --test tests/docker-signed-agent-engine-gate.test.mjs
          node --test tests/docker-signed-agent-last-moment-gate.test.mjs
          node --test tests/docker-signed-protocol-integration.test.mjs
