name: Cybersecurity Wave 18 offline
on:
  pull_request:
    paths:
      - 'scripts/security-wave18-real-auth.mjs'
      - 'tests/security-wave18-real-auth.test.mjs'
      - '.github/workflows/cybersecurity-wave18-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/security-wave18-real-auth.mjs'
      - 'tests/security-wave18-real-auth.test.mjs'
      - '.github/workflows/cybersecurity-wave18-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    name: Offline config and denial regression (not live staging)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Export only the two reviewed test inputs from the exact public event
      # commit. No checkout credential cleanup or legacy submodule traversal.
      - name: Fetch exact event commit and export Wave 18 files
        shell: bash
        env:
          TEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TEST_SHA" =~ ^[0-9a-f]{40}$ ]]
          source_dir="$(mktemp -d "$RUNNER_TEMP/wave18-source.XXXXXX")"
          git -C "$source_dir" init -q
          git -C "$source_dir" fetch --no-tags --depth=1 https://github.com/sunnybai72592/eternyx-haunted-hollow.git "$TEST_SHA"
          test "$(git -C "$source_dir" rev-parse FETCH_HEAD)" = "$TEST_SHA"
          mkdir -p scripts tests
          git -C "$source_dir" show "$TEST_SHA:scripts/security-wave18-real-auth.mjs" > scripts/security-wave18-real-auth.mjs
          git -C "$source_dir" show "$TEST_SHA:tests/security-wave18-real-auth.test.mjs" > tests/security-wave18-real-auth.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/security-wave18-real-auth.mjs
      - run: node --test tests/security-wave18-real-auth.test.mjs
