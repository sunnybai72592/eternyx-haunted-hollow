name: Docker live SQL acceptance on isolated PostgreSQL 17

on:
  pull_request:
    paths:
      - '.github/workflows/docker-lab-postgres-acceptance.yml'
      - 'tests/sql/docker-lab-db-acceptance.sql'
      - 'tests/sql/ctf-range-db-bootstrap.sql'
      - 'supabase/migrations/20261123030000_docker_workspace_enrollment.sql'
      - 'supabase/migrations/20261123040000_docker_agent_signed_reports.sql'
      - 'supabase/migrations/20261123050000_docker_operation_review.sql'
      - 'supabase/migrations/20261123070000_docker_signed_command_dispatch.sql'
      - 'supabase/migrations/20261123080000_docker_dispatch_receipt_recovery.sql'
      - 'supabase/migrations/20261123090000_docker_lab_incident_triage.sql'
      - 'supabase/migrations/20261123100000_docker_incident_containment.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-sql-acceptance:
    name: Real Docker owner A/B RLS, permits, receipts and incident holds on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable network-isolated PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-docker-postgres-ci -e POSTGRES_PASSWORD=isolated_ci_only postgres:17-alpine
          healthy=0
          for i in $(seq 1 45); do
            if docker exec eternyx-docker-postgres-ci pg_isready -U postgres >/dev/null 2>&1; then
              healthy=$((healthy+1))
              if [ "$healthy" -ge 3 ]; then break; fi
            else
              healthy=0
            fi
            sleep 1
          done
          docker exec eternyx-docker-postgres-ci pg_isready -U postgres
      - name: Bootstrap two synthetic accounts and minimum Supabase roles
        run: docker exec --interactive eternyx-docker-postgres-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
      - name: Apply all existing Docker migrations in declared order
        run: |
          for file in \
            supabase/migrations/20261123030000_docker_workspace_enrollment.sql \
            supabase/migrations/20261123040000_docker_agent_signed_reports.sql \
            supabase/migrations/20261123050000_docker_operation_review.sql \
            supabase/migrations/20261123070000_docker_signed_command_dispatch.sql \
            supabase/migrations/20261123080000_docker_dispatch_receipt_recovery.sql \
            supabase/migrations/20261123090000_docker_lab_incident_triage.sql \
            supabase/migrations/20261123100000_docker_incident_containment.sql; do
            docker exec --interactive eternyx-docker-postgres-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Verify actual RLS, replay, receipt idempotency and incident hold lifecycle
        run: docker exec --interactive eternyx-docker-postgres-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/docker-lab-db-acceptance.sql
      - name: Remove disposable PostgreSQL regardless of outcome
        if: always()
        run: docker rm --force eternyx-docker-postgres-ci || true
