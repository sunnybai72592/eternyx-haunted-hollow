name: Docker Phase 41 staged lifecycle before/after observation (NO DOCKER)

on:
  pull_request:
    paths:
      - '.github/workflows/docker-staging-lifecycle-phase41.yml'
      - 'src/lib/dockerStagingLifecycleEvidence.mjs'
      - 'src/lib/dockerSignedHostReadOnlyPreflight.mjs'
      - 'scripts/docker-lab-host-preflight.mjs'
      - 'scripts/docker-staging-lifecycle-review.mjs'
      - 'tests/docker-staging-lifecycle-phase41.test.mjs'
      - 'docs/DOCKER_STAGING_LIFECYCLE_PHASE41.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-lifecycle:
    name: Verify pinned lifecycle transitions and no-Docker observer with all prior signed-agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check real read-only host CLI, offline stage reviewer and phase41 contracts
        run: |
          node --check scripts/docker-lab-host-preflight.mjs
          node --check scripts/docker-staging-lifecycle-review.mjs
          node --check src/lib/dockerStagingLifecycleEvidence.mjs
          node --check src/lib/dockerSignedHostReadOnlyPreflight.mjs
          node --check tests/docker-staging-lifecycle-phase41.test.mjs
      - name: Require before/after stable policy, genuine lifecycle state and all earlier safety regressions
        env:
          CI: 'true'
        run: |
          node --test tests/docker-staging-lifecycle-phase41.test.mjs
          node --test tests/docker-host-challenge-ledger-phase40.test.mjs
          node --test tests/docker-signed-host-evidence-phase39.test.mjs
          node --test tests/docker-signed-host-readonly-preflight-phase38.test.mjs
          node --test tests/docker-signed-client-config-phase37.test.mjs
          node --test tests/docker-signed-cli-fd-exec-phase36.test.mjs
          node --test tests/docker-signed-cli-executable-pin.test.mjs
          node --test tests/docker-signed-normal-receipt-evidence.test.mjs
          node --test tests/docker-signed-receipt-replay-forensics.test.mjs
          node --test tests/docker-durable-journal-fsync.test.mjs
          node --test tests/docker-agent-attempt-disposition.test.mjs
          node --test tests/docker-strict-recovery-inventory.test.mjs
          node --test tests/docker-container-lock.test.mjs
          node --test tests/docker-signed-container-history-fence.test.mjs
          node --test tests/docker-signed-agent-engine-gate.test.mjs
          node --test tests/docker-signed-agent-last-moment-gate.test.mjs
          node --test tests/docker-signed-protocol-integration.test.mjs
