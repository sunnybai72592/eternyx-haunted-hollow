name: AI Arsenal local recovery
on:
  pull_request:
    paths:
      - 'src/lib/ai/document-corpus*.ts'
      - 'src/lib/ai/document-compare-tools.ts'
      - 'src/lib/ai/studio-chat-request.ts'
      - 'src/pages/AIDocumentIntelligence.tsx'
      - 'src/components/ai/StoredPdfCorpusImport.tsx'
      - 'src/components/ai/LocalOfficeCorpusImport.tsx'
      - 'src/components/ai/LocalCorpusDiscovery.tsx'
      - 'src/components/ai/LocalCorpusAnalytics.tsx'
      - 'src/components/ai/LocalCorpusValidation.tsx'
      - 'src/pages/AIArsenal.tsx'
      - 'tests/ai-corpus-*.test.mjs'
      - '.github/workflows/ai-arsenal-phase17-recovery.yml'
permissions:
  contents: read
jobs:
  recovery:
    name: Verified backup and selective recovery regressions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only the pinned test compiler
        run: |
          npm install --prefix "$RUNNER_TEMP/ai-recovery-compiler" --no-audit --no-fund --ignore-scripts --package-lock=false typescript@5.8.3 @xmldom/xmldom@0.8.11
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/ai-recovery-compiler/node_modules/typescript" node_modules/typescript
          ln -s "$RUNNER_TEMP/ai-recovery-compiler/node_modules/@xmldom" node_modules/@xmldom
      - name: Run actual recovery regressions
        run: node --test tests/ai-corpus-import-rotation-phase16.test.mjs tests/ai-corpus-selective-recovery-phase17.test.mjs tests/ai-corpus-version-review-phase18.test.mjs tests/ai-corpus-checkpoint-phase19.test.mjs tests/ai-corpus-knowledge-phase20.test.mjs tests/ai-corpus-knowledge-evidence-phase21.test.mjs tests/ai-corpus-rag-phase22.test.mjs tests/ai-corpus-assurance-phase23.test.mjs tests/ai-corpus-pdf-import-phase24.test.mjs tests/ai-corpus-office-phase25.test.mjs tests/ai-corpus-discovery-phase26.test.mjs tests/ai-corpus-analytics-phase27.test.mjs tests/ai-corpus-validation-phase28.test.mjs
