name: CPU joint clip diffusion
on:
  pull_request:
    paths:
      - "gpu-worker/train_joint_video_diffusion.py"
      - "gpu-worker/tests/test_joint_video_diffusion.py"
      - ".github/workflows/cpu-joint-video-diffusion.yml"
  push:
    branches: [main]
    paths:
      - "gpu-worker/train_joint_video_diffusion.py"
      - "gpu-worker/tests/test_joint_video_diffusion.py"
      - ".github/workflows/cpu-joint-video-diffusion.yml"
permissions:
  contents: read
jobs:
  joint-diffusion:
    name: Train joint video denoiser from scratch and generate real MP4 from noise
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded CPU numerical dependency and FFmpeg
        run: |
          python -m pip install numpy==2.2.6
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          python -c "import numpy; print(numpy.__version__)"
          ffmpeg -hide_banner -encoders | grep -q libx264
      - name: Train, evaluate disjoint source clips, remove source media and generate
        run: python -m unittest discover -s gpu-worker/tests -p 'test_joint_video_diffusion.py' -v
