name: LABS independently authenticated kernel provenance
on:
  pull_request:
    paths:
      - '.github/workflows/labs-runner-kernel-provenance.yml'
      - 'scripts/labs-runner-kernel-provenance.py'
      - 'tests/labs-runner-kernel-provenance-test.py'
  workflow_dispatch:
    inputs:
      approval:
        description: Verify exact Phase 41 kernel against signed Ubuntu archive, no install
        required: true
        type: choice
        options:
          - DENY
          - I_APPROVE_EPHEMERAL_KERNEL_PROVENANCE
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          submodules: false
      - name: Remove checkout authorization
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || test "$?" -eq 5
          rc=0
          git config --local --get-all http.https://github.com/.extraheader > /dev/null || rc=$?
          test "$rc" -eq 1
      - name: Offline signed archive and immutable pin contracts
        run: python3 -B tests/labs-runner-kernel-provenance-test.py
  archive-provenance:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approval == 'I_APPROVE_EPHEMERAL_KERNEL_PROVENANCE' }}
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          submodules: false
      - name: Remove checkout authorization
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || test "$?" -eq 5
          rc=0
          git config --local --get-all http.https://github.com/.extraheader > /dev/null || rc=$?
          test "$rc" -eq 1
      - name: Verify archive provenance without installing any package
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/eternyx-kernel-copy.XXXXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          if sudo -n /usr/bin/cat "/boot/vmlinuz-$(uname -r)" > "$work/kernel"; then
            python3 -I -B scripts/labs-runner-kernel-provenance.py "$work/kernel"
          else
            echo "Current runner kernel copy unavailable; historical archive proof remains independent."
            python3 -I -B scripts/labs-runner-kernel-provenance.py
          fi
