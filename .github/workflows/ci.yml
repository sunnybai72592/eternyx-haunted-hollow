name: CI

on:
  push:
    branches: [main, "chore/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run utility tests
        run: npm test
      - name: Check utility JavaScript syntax
        run: |
          node --check src/lib/developerStudioUtils.mjs
          node --check tests/developer-studio-utils.test.mjs
          node --check src/lib/apiWorkbenchUtils.mjs
          node --check tests/api-workbench-utils.test.mjs
          node --check src/lib/devopsLaunchpadUtils.mjs
          node --check tests/devops-launchpad-utils.test.mjs
          node --check src/lib/githubHubUtils.mjs
          node --check tests/github-hub-utils.test.mjs
      - name: Build application
        run: npm run build
