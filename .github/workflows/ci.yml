name: CI

on:
  push:
    branches: [main, "chore/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run utility tests
        run: npm test
      - name: Check utility JavaScript syntax
        run: |
          node --check src/lib/developerStudioUtils.mjs
          node --check tests/developer-studio-utils.test.mjs
          node --check src/lib/apiWorkbenchUtils.mjs
          node --check tests/api-workbench-utils.test.mjs
          node --check src/lib/devopsLaunchpadUtils.mjs
          node --check tests/devops-launchpad-utils.test.mjs
          node --check src/lib/deploymentIntelligenceUtils.mjs
          node --check tests/deployment-intelligence-utils.test.mjs
          node --check src/lib/githubHubUtils.mjs
          node --check tests/github-hub-utils.test.mjs
          node --check src/lib/githubCollaborationUtils.mjs
          node --check tests/github-collaboration-utils.test.mjs
          node --check src/lib/githubChangeUtils.mjs
          node --check tests/github-change-utils.test.mjs
          node --check src/lib/githubActionsUtils.mjs
          node --check tests/github-actions-utils.test.mjs
          node --check src/lib/githubReleaseUtils.mjs
          node --check tests/github-release-utils.test.mjs
      - name: Build application
        run: npm run build
      - name: Exercise public tool journeys in desktop and mobile Chrome viewports
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/eternyx-browser"
          "$RUNNER_TEMP/eternyx-browser/bin/pip" install --disable-pip-version-check playwright==1.56.0
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ >/dev/null
          "$RUNNER_TEMP/eternyx-browser/bin/python" tests/browser/preview_smoke.py
      - name: Upload local-preview browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eternyx-preview-browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-preview-acceptance.json
          if-no-files-found: warn
          retention-days: 14
