name: CI

on:
  push:
    branches: [main, "chore/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run utility tests
        run: npm test
      - name: Validate Automation runtime source and JWT policy inventory (offline only)
        run: node scripts/automation-runtime-readiness.mjs --source-check
      - name: Inventory Workspace release-critical SQL, smoke tests, and CI wiring (offline only)
        run: node scripts/workspace-release-readiness.mjs --source-check
      - name: Generate offline Automation migration-risk report (not deployment authorization)
        run: node scripts/automation-staging-deployment-plan.mjs > "$RUNNER_TEMP/automation-staging-plan.json"
      - name: Verify historical cross-pillar migration collision baseline (no DB access)
        run: |
          node scripts/automation-migration-collision-forensics.mjs > "$RUNNER_TEMP/eternyx-migration-collisions.json"
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/eternyx-migration-collisions.json","utf8"));console.log("Historical migration collisions: "+r.collisionVersionCount+" versions, "+r.collisionFileCount+" source files; baseline="+r.sourceBaselineValid+"; staging deploy BLOCKED pending remote history.");'
      - name: Validate unique versions for a source-pinned fresh local staging mirror
        run: node scripts/automation-fresh-staging-mirror.mjs --check > "$RUNNER_TEMP/eternyx-fresh-staging-plan.json"
      - name: Check utility JavaScript syntax
        run: |
          node --check src/lib/developerStudioUtils.mjs
          node --check tests/developer-studio-utils.test.mjs
          node --check src/lib/apiWorkbenchUtils.mjs
          node --check tests/api-workbench-utils.test.mjs
          node --check src/lib/devopsLaunchpadUtils.mjs
          node --check tests/devops-launchpad-utils.test.mjs
          node --check src/lib/deploymentIntelligenceUtils.mjs
          node --check tests/deployment-intelligence-utils.test.mjs
          node --check src/lib/githubHubUtils.mjs
          node --check tests/github-hub-utils.test.mjs
          node --check src/lib/githubCollaborationUtils.mjs
          node --check tests/github-collaboration-utils.test.mjs
          node --check src/lib/githubChangeUtils.mjs
          node --check tests/github-change-utils.test.mjs
          node --check src/lib/githubActionsUtils.mjs
          node --check tests/github-actions-utils.test.mjs
          node --check src/lib/githubReleaseUtils.mjs
          node --check tests/github-release-utils.test.mjs
      - name: Build application
        run: npm run build
      - name: Validate release provenance across generated HTML, JS and JSON
        run: node scripts/assertReleaseArtifact.mjs
      - name: Exercise public tool journeys in desktop and mobile Chrome viewports
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/eternyx-browser"
          "$RUNNER_TEMP/eternyx-browser/bin/pip" install --disable-pip-version-check playwright==1.56.0
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ >/dev/null
          "$RUNNER_TEMP/eternyx-browser/bin/python" tests/browser/preview_smoke.py
      - name: Upload local-preview browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eternyx-preview-browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-preview-acceptance.json
          if-no-files-found: warn
          retention-days: 14

  # Execute heavyweight combined SQL only on Automation/Docker PRs; the
  # standalone replay workflow remains available for explicit dispatch.
  combined-isolated-postgres:
    if: github.event_name == 'pull_request' && (contains(github.head_ref, 'automation') || contains(github.head_ref, 'docker'))
    name: Actually replay Automation + Docker SQL together in networkless PG17
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MIRROR_PATH: ${{ runner.temp }}/eternyx-combined-sql-mirror-${{ github.run_id }}-${{ github.run_attempt }}
      REPLAY_PLAN: ${{ runner.temp }}/eternyx-combined-sql-mirror-${{ github.run_id }}-${{ github.run_attempt }}/ordered-replay.txt
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22 for the offline planner
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source fingerprints and replay security boundaries
        run: |
          node --test tests/automation-postgres17-replay-plan.test.mjs
          node scripts/automation-migration-collision-forensics.mjs > "$RUNNER_TEMP/historical-collisions.json"
      - name: Create unlinked migration mirror and verify ordered two-pillar plan
        shell: bash
        run: |
          node scripts/automation-fresh-staging-mirror.mjs --create-fresh-local-mirror --output "$MIRROR_PATH" > "$RUNNER_TEMP/automation-mirror-evidence.json"
          node scripts/automation-postgres17-replay-plan.mjs --mirror "$MIRROR_PATH" --plan "$REPLAY_PLAN" > "$RUNNER_TEMP/automation-dual-pillar-plan.json"
      - name: Start disposable network-isolated PostgreSQL 17
        shell: bash
        run: |
          docker run --detach --rm --network none --name eternyx-automation-docker-replay \
            -e POSTGRES_PASSWORD=local_ci_only postgres:17-alpine
          stable=0
          for i in $(seq 1 45); do
            if docker exec eternyx-automation-docker-replay pg_isready -U postgres >/dev/null 2>&1; then
              stable=$((stable+1))
              if [ "$stable" -ge 4 ]; then break; fi
            else
              stable=0
            fi
            sleep 1
          done
          docker exec eternyx-automation-docker-replay pg_isready -U postgres
      - name: Bootstrap only disposable synthetic identities and Supabase roles
        run: docker exec --interactive eternyx-automation-docker-replay psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
      - name: Apply combined SQL migrations in the fresh mirror's unique timestamp order
        shell: bash
        run: |
          set -euo pipefail
          count=0
          echo "Combined SQL replay: NOT a Supabase production deployment" > "$RUNNER_TEMP/automation-cross-pillar-result.txt"
          while IFS= read -r migration; do
            if [[ ! "$migration" =~ ^20[0-9]{12}_[A-Za-z0-9_-]+\.sql$ ]]; then
              echo "::error::Untrusted migration filename in replay plan"
              exit 1
            fi
            file="$MIRROR_PATH/supabase/migrations/$migration"
            if [ ! -f "$file" ]; then
              echo "::error::Mirror SQL file is missing"
              exit 1
            fi
            if ! docker exec --interactive eternyx-automation-docker-replay psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file" > /dev/null 2> "$RUNNER_TEMP/automation-psql-error.txt"; then
              echo "::error title=Cross-pillar SQL migration failed::$migration"
              echo "FAILED: $migration" >> "$RUNNER_TEMP/automation-cross-pillar-result.txt"
              sed -n '1,30p' "$RUNNER_TEMP/automation-psql-error.txt"
              exit 1
            fi
            count=$((count+1))
          done < "$REPLAY_PLAN"
          echo "Migrations successfully applied to disposable PostgreSQL 17: $count" | tee -a "$RUNNER_TEMP/automation-cross-pillar-result.txt"
          if [ "$count" -lt 28 ]; then
            echo "::error::Incomplete migration replay"
            exit 1
          fi
      - name: Verify owner isolation, quotas, idempotency and safe workflow actions
        run: docker exec --interactive eternyx-automation-docker-replay psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/automation-control-db-smoke.sql
      - name: Verify actual Docker owner isolation, permits, receipts and incident holds
        run: docker exec --interactive eternyx-automation-docker-replay psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/docker-lab-db-acceptance.sql
      - name: Publish local-only sanitized migration replay outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eternyx-automation-docker-offline-pg17-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/automation-cross-pillar-result.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Remove disposable PostgreSQL regardless of result
        if: always()
        run: docker rm --force eternyx-automation-docker-replay || true
