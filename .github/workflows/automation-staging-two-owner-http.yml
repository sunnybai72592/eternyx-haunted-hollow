name: Automation isolated staging two-real-account HTTP acceptance

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "INSPECT_ONLY reads records; ONE_TEMPORARY_WORKFLOW saves/runs/deletes one test workflow."
        required: true
        type: choice
        options:
          - INSPECT_ONLY
          - ONE_TEMPORARY_WORKFLOW
        default: INSPECT_ONLY
      test_accounts_review:
        description: "Reviewer verified two dedicated nonanonymous staging-only password accounts; temporary access tokens are obtained at runtime."
        required: true
        type: choice
        options:
          - NOT_REVIEWED
          - STAGING_TEST_ACCOUNTS_REVIEWED
        default: NOT_REVIEWED
      write_approval:
        description: "Only for ONE_TEMPORARY_WORKFLOW; acknowledges workflow write, one run, replay, deletion, and retained audit history."
        required: true
        type: choice
        options:
          - NOT_APPROVED
          - I_AUTHORIZE_ONE_ISOLATED_STAGING_RUN
        default: NOT_APPROVED

permissions:
  contents: read

concurrency:
  group: eternyx-automation-staging-core-release
  cancel-in-progress: false

jobs:
  two-real-owners:
    if: "${{ github.ref == 'refs/heads/main' && inputs.test_accounts_review == 'STAGING_TEST_ACCOUNTS_REVIEWED' && (inputs.run_mode == 'INSPECT_ONLY' || (inputs.run_mode == 'ONE_TEMPORARY_WORKFLOW' && inputs.write_approval == 'I_AUTHORIZE_ONE_ISOLATED_STAGING_RUN')) }}"
    name: Real two-owner Auth, isolation, manual workflow, idempotency and cleanup
    environment: automation-staging
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ETERNYX_AUTOMATION_STAGING_REF: "${{ vars.ETERNYX_AUTOMATION_STAGING_REF }}"
      ETERNYX_AUTOMATION_PRODUCTION_REF: wcncuarekaofmfurbtbh
      ETERNYX_AUTOMATION_TWO_OWNER_MODE: "${{ inputs.run_mode }}"
      ETERNYX_AUTOMATION_TWO_OWNER_REVIEW: "${{ inputs.test_accounts_review }}"
      ETERNYX_AUTOMATION_TWO_OWNER_WRITE_CONSENT: "${{ inputs.write_approval }}"
    steps:
      - name: Check out reviewed main without persisted checkout credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deny production or unapproved staging write mode BEFORE reading account secrets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/automation-staging-two-owner-gate.mjs --check-config > "$RUNNER_TEMP/automation-two-owner-intent.json"
      - name: Independently verify the exact separate staging project and three active core functions via read-only Management GET
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: "${{ secrets.ETERNYX_AUTOMATION_STAGING_MANAGEMENT_TOKEN }}"
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {validateTwoOwnerGate} from "./scripts/automation-staging-two-owner-gate.mjs";
          import {fetchStageManagement,inspectStageProject,verifyDeployedCore} from "./scripts/automation-staging-core-release.mjs";
          const target=validateTwoOwnerGate(process.env);
          const base="https://api.supabase.com/v1/projects/"+target.stagingRef;
          const raw=await fetchStageManagement(base,process.env.SUPABASE_ACCESS_TOKEN);
          inspectStageProject(raw,target.stagingRef);
          const functions=await fetchStageManagement(base+"/functions",process.env.SUPABASE_ACCESS_TOKEN);
          if(verifyDeployedCore(functions).length!==3)throw Error("Staging core functions unverified");
          console.log("Verified independent staging project and three active core handlers with expected JWT policies.");
          NODE
      - name: Authenticate two dedicated staging accounts with fresh access JWTs and verify private ownership
        shell: bash
        timeout-minutes: 6
        env:
          ETERNYX_AUTOMATION_STAGING_PUBLISHABLE_KEY: "${{ vars.ETERNYX_AUTOMATION_STAGING_PUBLISHABLE_KEY }}"
          ETERNYX_AUTOMATION_STAGING_OWNER_A_EMAIL: "${{ secrets.ETERNYX_AUTOMATION_STAGING_OWNER_A_EMAIL }}"
          ETERNYX_AUTOMATION_STAGING_OWNER_A_PASSWORD: "${{ secrets.ETERNYX_AUTOMATION_STAGING_OWNER_A_PASSWORD }}"
          ETERNYX_AUTOMATION_STAGING_OWNER_B_EMAIL: "${{ secrets.ETERNYX_AUTOMATION_STAGING_OWNER_B_EMAIL }}"
          ETERNYX_AUTOMATION_STAGING_OWNER_B_PASSWORD: "${{ secrets.ETERNYX_AUTOMATION_STAGING_OWNER_B_PASSWORD }}"
        run: |
          set -euo pipefail
          mode="--inspect"
          if [ "$ETERNYX_AUTOMATION_TWO_OWNER_MODE" = "ONE_TEMPORARY_WORKFLOW" ]; then
            mode="--execute"
          fi
          node scripts/automation-staging-fresh-auth.mjs "$mode" > "$RUNNER_TEMP/automation-two-owner-verified.json"
          node --input-type=module - "$RUNNER_TEMP/automation-two-owner-verified.json" <<'NODE'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          import {validateTwoOwnerGate} from "./scripts/automation-staging-two-owner-gate.mjs";
          const intent=validateTwoOwnerGate(process.env);
          const report=JSON.parse(readFileSync(process.argv[2],"utf8"));
          assert.equal(report.mode,intent.mode);
          assert.equal(report.authMethod,"fresh_staging_password_signin");
          assert.equal(report.freshSessions,2);
          assert.equal(report.initialInspectionPassed,true);
          assert.equal(report.tokenValuesPersisted,false);
          assert.equal(report.releaseAuthorized,false);
          assert.equal(report.productionReady,false);
          console.log("Fresh staging-only sessions, two-owner isolation and approved workflow mode verified; no access tokens or test account credentials persisted.");
          NODE
      - name: Publish ONLY the sanitized two-owner staging acceptance receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eternyx-automation-two-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/automation-two-owner-verified.json
          if-no-files-found: error
          retention-days: 7
