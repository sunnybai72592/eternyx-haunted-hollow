name: CPU learned tagged spatial motion

on:
  pull_request:
    paths:
      - "gpu-worker/learn_tagged_spatial_motion.py"
      - "gpu-worker/tests/test_learn_tagged_spatial_motion.py"
      - "gpu-worker/train_tagged_neural_video.py"
      - "gpu-worker/train_spatiotemporal_neural_video.py"
      - ".github/workflows/cpu-tagged-spatial-motion.yml"
  push:
    branches: [main]
    paths:
      - "gpu-worker/learn_tagged_spatial_motion.py"
      - "gpu-worker/tests/test_learn_tagged_spatial_motion.py"
      - "gpu-worker/train_tagged_neural_video.py"
      - "gpu-worker/train_spatiotemporal_neural_video.py"
      - ".github/workflows/cpu-tagged-spatial-motion.yml"

permissions:
  contents: read

jobs:
  tagged-spatial-motion:
    name: Learn real per-tag neural motion tiles and render verified CPU H264
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require local FFmpeg, FFprobe and libx264
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep -q libx264
      - name: Train actual spatial motion classifiers, check heldout isolation and produce real MP4
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
          OMP_NUM_THREADS: "1"
        run: python -m unittest discover -s gpu-worker/tests -p 'test_learn_tagged_spatial_motion.py' -v
