name: Docker full migration-chain and staging-readiness acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/docker-staging-readiness.yml'
      - '.github/workflows/docker-staging-readonly-manual.yml'
      - 'src/lib/dockerStagingAcceptance.mjs'
      - 'scripts/docker-staging-acceptance.mjs'
      - 'tests/docker-staging-acceptance.test.mjs'
      - 'docs/DOCKER_STAGING_ACCEPTANCE.md'
      - 'supabase/migrations/20261123*docker*.sql'
      - 'tests/sql/docker-*.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-migrations:
    name: Real single-PostgreSQL Docker migration upgrade and both owner RLS suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test manual staging gates with fake non-network transports
        run: node --test tests/docker-staging-acceptance.test.mjs
      - name: Start disposable isolated PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-docker-staging-acceptance-ci -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          ready=0
          for i in $(seq 1 50); do
            if docker exec eternyx-docker-staging-acceptance-ci pg_isready -U postgres >/dev/null 2>&1; then
              ready=$((ready+1))
              if [ "$ready" -ge 2 ]; then break; fi
            else
              ready=0
            fi
            sleep 1
          done
          docker exec eternyx-docker-staging-acceptance-ci pg_isready -U postgres
      - name: Bootstrap two synthetic users and Supabase DB roles
        run: docker exec --interactive eternyx-docker-staging-acceptance-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
      - name: Apply seven agent, signed dispatch and containment migrations in order
        run: |
          for file in \
            supabase/migrations/20261123030000_docker_workspace_enrollment.sql \
            supabase/migrations/20261123040000_docker_agent_signed_reports.sql \
            supabase/migrations/20261123050000_docker_operation_review.sql \
            supabase/migrations/20261123070000_docker_signed_command_dispatch.sql \
            supabase/migrations/20261123080000_docker_dispatch_receipt_recovery.sql \
            supabase/migrations/20261123090000_docker_lab_incident_triage.sql \
            supabase/migrations/20261123100000_docker_incident_containment.sql; do
            docker exec --interactive eternyx-docker-staging-acceptance-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Execute real agent owner RLS, nonce, receipt and containment SQL acceptance
        run: docker exec --interactive eternyx-docker-staging-acceptance-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/docker-lab-db-acceptance.sql
      - name: Apply baseline release review migration
        run: docker exec --interactive eternyx-docker-staging-acceptance-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123110000_docker_release_review_history.sql
      - name: Execute real baseline owner release history SQL acceptance
        run: docker exec --interactive eternyx-docker-staging-acceptance-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/docker-release-review-db-acceptance.sql
      - name: Upgrade independent reviewer and SHA-256 event-chain schema
        run: docker exec --interactive eternyx-docker-staging-acceptance-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123120000_docker_reviewer_accountability_and_event_chain.sql
      - name: Execute real reviewer consent, owner RLS and audit chain acceptance
        run: docker exec --interactive eternyx-docker-staging-acceptance-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/docker-independent-reviewer-db-acceptance.sql
      - name: Upgrade owner-only full audit export
        run: docker exec --interactive eternyx-docker-staging-acceptance-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123130000_docker_full_release_audit_export.sql
      - name: Verify actual complete owner history export and cross-owner refusal
        run: docker exec --interactive eternyx-docker-staging-acceptance-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/docker-full-audit-export-db-acceptance.sql
      - name: Remove isolated PostgreSQL
        if: always()
        run: docker rm --force eternyx-docker-staging-acceptance-ci || true
