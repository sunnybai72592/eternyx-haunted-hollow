name: Automation Workflow Policy and Trigger Readiness SQL Acceptance

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261123060000_automation_workflow_policies.sql'
      - 'tests/sql/automation-workflow-policy-db-smoke.sql'
      - '.github/workflows/automation-workflow-policies-sql.yml'
      - 'tests/sql/ctf-range-db-bootstrap.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    name: Verify live workflow policy enforcement, daily caps, channel denials and owner readiness on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable network-isolated PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-policy-ci -e POSTGRES_PASSWORD=local_ci_only postgres:17-alpine
          stable=0
          for i in $(seq 1 45); do
            if docker exec eternyx-policy-ci pg_isready -U postgres >/dev/null 2>&1; then
              stable=$((stable+1))
              if [ "$stable" -ge 4 ]; then break; fi
            else
              stable=0
            fi
            sleep 1
          done
          docker exec eternyx-policy-ci pg_isready -U postgres || { docker logs eternyx-policy-ci; exit 1; }
      - name: Bootstrap two private fixture accounts
        run: docker exec --interactive eternyx-policy-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
      - name: Apply prior workflow/webhook/scheduler/approval and Phase 2J migrations
        run: |
          for file in \
            supabase/migrations/20261122220000_automation_manual_control_plane.sql \
            supabase/migrations/20261122230000_automation_signed_webhook_triggers.sql \
            supabase/migrations/20261122234500_automation_scheduled_runs.sql \
            supabase/migrations/20261123000000_automation_webhook_approvals.sql \
            supabase/migrations/20261123060000_automation_workflow_policies.sql; do
            docker exec --interactive eternyx-policy-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Verify actual database run enforcement and factual policy readiness
        run: docker exec --interactive eternyx-policy-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/automation-workflow-policy-db-smoke.sql
      - name: Remove disposable PostgreSQL
        if: always()
        run: docker rm --force eternyx-policy-ci || true
