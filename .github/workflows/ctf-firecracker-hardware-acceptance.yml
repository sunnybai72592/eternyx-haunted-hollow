name: CTF Firecracker Hardware Acceptance Contract

on:
  pull_request:
    paths:
      - 'infrastructure/cyber-range/provider/firecracker-hardware-acceptance.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-boot-controller.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-systemd-supervisor.mjs'
      - 'scripts/cyber-range-microvm-hardware-acceptance.mjs'
      - 'tests/ctf-firecracker-hardware-acceptance.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-hardware-evidence.mjs'
      - 'tests/ctf-firecracker-hardware-evidence.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-guest-probe.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-expiry-drill.mjs'
      - 'infrastructure/cyber-range/guest/eternyx_vsock_probe.py'
      - 'tests/ctf-firecracker-guest-probe-expiry.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-operator-evidence.mjs'
      - 'tests/ctf-firecracker-operator-evidence.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-independent-review.mjs'
      - 'scripts/cyber-range-independent-review.mjs'
      - 'tests/ctf-firecracker-independent-review.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-operator-handoff.mjs'
      - 'scripts/cyber-range-operator-handoff.mjs'
      - 'tests/ctf-firecracker-operator-handoff.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-handoff-import-journal.mjs'
      - 'tests/ctf-firecracker-handoff-import-journal.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-evidence-consistency.mjs'
      - 'tests/ctf-firecracker-evidence-consistency.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-review-disposition.mjs'
      - 'tests/ctf-firecracker-review-disposition.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-review-checkpoint.mjs'
      - 'scripts/cyber-range-review-checkpoint.mjs'
      - 'tests/ctf-firecracker-review-checkpoint.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-runtime-observations.mjs'
      - 'tests/ctf-firecracker-runtime-observations.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-runtime-addendum.mjs'
      - 'scripts/cyber-range-runtime-addendum.mjs'
      - 'tests/ctf-firecracker-runtime-addendum.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-offline-atomic-publish.mjs'
      - 'tests/ctf-firecracker-offline-atomic-publish.test.mjs'
      - 'infrastructure/cyber-range/provider/firecracker-private-safe-read.mjs'
      - 'tests/ctf-firecracker-private-safe-read.test.mjs'
      - 'tests/ctf-firecracker-systemd-supervisor.test.mjs'
      - 'tests/ctf-firecracker-boot-controller.test.mjs'
      - '.github/workflows/ctf-firecracker-hardware-acceptance.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-vm-security-tests:
    name: Offline KVM approval, actual jailer namespace and guaranteed cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove acceptance and existing Firecracker safety boundaries
        run: |
          node --test tests/ctf-firecracker-hardware-acceptance.test.mjs \
            tests/ctf-firecracker-hardware-evidence.test.mjs \
            tests/ctf-firecracker-guest-probe-expiry.test.mjs \
            tests/ctf-firecracker-operator-evidence.test.mjs \
            tests/ctf-firecracker-independent-review.test.mjs \
            tests/ctf-firecracker-operator-handoff.test.mjs \
            tests/ctf-firecracker-handoff-import-journal.test.mjs \
            tests/ctf-firecracker-evidence-consistency.test.mjs \
            tests/ctf-firecracker-review-disposition.test.mjs \
            tests/ctf-firecracker-review-checkpoint.test.mjs \
            tests/ctf-firecracker-runtime-observations.test.mjs \
            tests/ctf-firecracker-runtime-addendum.test.mjs \
            tests/ctf-firecracker-offline-atomic-publish.test.mjs \
            tests/ctf-firecracker-private-safe-read.test.mjs \
            tests/ctf-firecracker-systemd-supervisor.test.mjs \
            tests/ctf-firecracker-boot-controller.test.mjs
      - name: No operator approval must refuse live guest boot
        run: |
          node scripts/cyber-range-microvm-hardware-acceptance.mjs --help
          if node scripts/cyber-range-microvm-hardware-acceptance.mjs --run \
            --confirm-local-kvm \
            --session 123e4567-e89b-42d3-a456-426614174001 \
            --uid 22001 --gid 22001 \
            --kernel-sha aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --rootfs-sha bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --jailer-sha cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --firecracker-sha dddddddddddddddddddddddddddddddddddddddddddddddddddddddd; then
            echo 'UNAPPROVED LIVE KVM BOOT' >&2
            exit 1
          fi
      - name: Ensure no VM, cloud or public lab started
        run: |
          if pgrep -x firecracker >/dev/null 2>&1; then
            echo 'Unexpected Firecracker guest in no-cost CI' >&2
            exit 1
          fi
