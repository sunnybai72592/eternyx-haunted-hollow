name: Cybersecurity live staging acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [pre-cutover, post-cutover, scanners]
        required: true
      tls_host:
        description: "Optional owned or explicitly authorized TLS assessment hostname"
        type: string
        required: false
      tls_acknowledge:
        description: "If TLS host supplied, type I_AUTHORIZE_TLS_ASSESSMENT_OF_THIS_HOST"
        type: string
        required: false
      acknowledge:
        description: "Type I_APPROVE_SYNTHETIC_STAGING_GATEWAY_FIXTURES"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cybersecurity-staging-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main' && inputs.acknowledge == 'I_APPROVE_SYNTHETIC_STAGING_GATEWAY_FIXTURES'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cybersecurity-staging
    steps:
      - name: Fetch reviewed source without submodule checkout
        shell: bash
        env:
          TEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TEST_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init -q
          git fetch --no-tags --depth=1 https://github.com/sunnybai72592/eternyx-haunted-hollow.git "$TEST_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$TEST_SHA"
          mkdir -p scripts
          for script in security-wave18-real-auth security-wave19-session-evidence security-wave21-live-fence security-wave25-gateway-acceptance security-wave29-scanner-acceptance; do
            git show "$TEST_SHA:scripts/$script.mjs" > "scripts/$script.mjs"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute real staging acceptance
        shell: bash
        env:
          ETERNYX_STAGING_URL: https://mhodwvypfbxafamkrgsk.supabase.co
          ETERNYX_STAGING_PROJECT_REF: mhodwvypfbxafamkrgsk
          ETERNYX_PRODUCTION_PROJECT_REF: wcncuarekaofmfurbtbh
          ETERNYX_STAGING_ONLY: 'yes'
          ETERNYX_W18_ACK: I_APPROVE_PERSISTENT_SYNTHETIC_STAGING_FIXTURES
          ETERNYX_W25_ACK: I_APPROVE_SYNTHETIC_STAGING_GATEWAY_FIXTURES
          ETERNYX_W29_ACK: I_APPROVE_STAGING_SCANNER_RESEARCH
          ETERNYX_W29_TLS_HOST: ${{ inputs.tls_host }}
          ETERNYX_W29_TLS_ACK: ${{ inputs.tls_acknowledge }}
          ETERNYX_W25_PHASE: ${{ inputs.phase }}
          ETERNYX_STAGING_PUBLIC_KEY: ${{ secrets.ETERNYX_STAGING_PUBLIC_KEY }}
          ETERNYX_W18_EMAIL_A: ${{ secrets.ETERNYX_W18_EMAIL_A }}
          ETERNYX_W18_EMAIL_B: ${{ secrets.ETERNYX_W18_EMAIL_B }}
          ETERNYX_W18_PASSWORD_A: ${{ secrets.ETERNYX_W18_PASSWORD_A }}
          ETERNYX_W18_PASSWORD_B: ${{ secrets.ETERNYX_W18_PASSWORD_B }}
        run: |
          set -euo pipefail
          if [[ "$ETERNYX_W25_PHASE" == "scanners" ]]; then
            node scripts/security-wave29-scanner-acceptance.mjs --check-config
            node scripts/security-wave29-scanner-acceptance.mjs --run > observation.json
          else
            node scripts/security-wave25-gateway-acceptance.mjs --check-config
            node scripts/security-wave25-gateway-acceptance.mjs --run > observation.json
          fi
          cat observation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cybersecurity-staging-observation
          path: observation.json
          retention-days: 7
          if-no-files-found: error
