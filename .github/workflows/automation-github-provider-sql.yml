name: Automation GitHub Public Read SQL Acceptance

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261123020000_automation_github_read_provider.sql'
      - 'tests/sql/automation-github-provider-db-smoke.sql'
      - '.github/workflows/automation-github-provider-sql.yml'
      - 'tests/sql/ctf-range-db-bootstrap.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    name: Verify GitHub read quotas, receipts, owner isolation and retention on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable network-isolated PostgreSQL 17
        run: |
          docker run --detach --rm --network none --name eternyx-gh-read-ci -e POSTGRES_PASSWORD=local_ci_only postgres:17-alpine
          stable=0
          for i in $(seq 1 45); do
            if docker exec eternyx-gh-read-ci pg_isready -U postgres >/dev/null 2>&1; then
              stable=$((stable+1))
              if [ "$stable" -ge 4 ]; then break; fi
            else
              stable=0
            fi
            sleep 1
          done
          docker exec eternyx-gh-read-ci pg_isready -U postgres || {
            docker logs eternyx-gh-read-ci
            exit 1
          }
      - name: Bootstrap two Supabase fixture accounts
        run: docker exec --interactive eternyx-gh-read-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/ctf-range-db-bootstrap.sql
      - name: Apply read-only GitHub provider migration
        run: docker exec --interactive eternyx-gh-read-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261123020000_automation_github_read_provider.sql
      - name: Verify disabled defaults, receipt fences, quotas and privacy
        run: docker exec --interactive eternyx-gh-read-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/automation-github-provider-db-smoke.sql
      - name: Remove disposable PostgreSQL
        if: always()
        run: docker rm --force eternyx-gh-read-ci || true
